name: BAR-FLEET-OVERNIGHT
inherits:
  - atlas/ATLAS.md
  - atlas/constants/UNIFIED_TEMPLATE.md@v2.8.0
  - atlas/constants/UT_CHECKLIST.md@v1.3.1
  - atlas/constants/BS_LAW.md@v1.4.0
  - atlas/constants/BOOK_LAW.md@v1.5.0
  - atlas/constants/BARTON_ENTERPRISES_CTB.md
  - atlas/constants/FOUR_BRAIN_AVIATION.md@v1.2.0

description: |
  Overnight 16-process readiness sweep. Authored 2026-05-10 by Opus 4.7
  Planner under sovereign directive. Captures audit verdict (UT-Body 16/16
  GREEN, drift in 3 sub-layers documented). Enumerates 5 sequential WOs
  (MC nav + UT logbooks + RIM-GATE adoption + Codex audit + LBB ingest).
  Surfaces 12 sovereign-only unknowns for morning walkthrough decision batch.

inputs:
  prior_bars:
    - BAR-MONDAY-16-FLEET-GREEN  # closed 2026-05-08 (16/16 UT-Body certified provisional-runtime)
    - BAR-RIM-GATE-DRAFT          # closed 2026-05-10, Codex PROVISIONAL on commit 91570756
  prior_commits:
    - imo-creator-v2@1a1066b2     # MC RimGateTile + nav entry deployed
    - barton-processes@96fbff7    # LCS-100 patch
    - barton-processes@b2185fc    # LCS-100 patch
    - barton-processes@1c78a58    # LCS-100 patch
    - barton-processes@d55015b    # LCS-100 patch
    - barton-processes@91570756   # RIM-GATE adoption on bp.100
  doppler_state:
    - imo-creator/dev/MAILGUN_DOMAINS (15 insurance-aligned domains populated)
  fleet_state:
    - 16 PROCESS-UT.md files (all UT v2.8.0 conformant)
    - 16 workflow.yaml companion files (Y-junction conformant)
    - 4 D1 binding gaps (bp.800, bp.810-primary, bp.900, bp.830-entirely-commented)
    - 2 implementation gaps (bp.010 namespace collision, bp.700 UT-only)
    - 6 RIM-GATE adoption candidates (bp.100 already adopted, 5 pending)

schedule:
  type: one-shot
  cron: null
  trigger: sovereign-overnight-directive
  duration_estimate: overnight (8-12 hours wall clock)
  wo_sequencing:
    - WO-1 + WO-2 can run parallel
    - WO-3 depends on WO-2 (version bumps must land first)
    - WO-4 depends on WO-1 + WO-2 + WO-3 (audits assembled bundle)
    - WO-5 depends on WO-4 P=1 verdict

data:
  read:
    - atlas/ATLAS.md
    - atlas/constants/UNIFIED_TEMPLATE.md
    - atlas/constants/UT_CHECKLIST.md
    - atlas/constants/BS_LAW.md
    - atlas/constants/BOOK_LAW.md
    - atlas/constants/BARTON_ENTERPRISES_CTB.md
    - 16 × factory/<branch>/<NNN>-*/PROCESS-UT.md
    - 16 × factory/<branch>/<NNN>-*/workflow.yaml
    - imo-creator-v2/workers/mission-control/src/data/navigation.ts
    - imo-creator-v2/atlas/manifests/paired-artifacts.yaml
    - imo-creator-v2/fleet/specializations/throughput-control/SPECIALIZATION.md
  write:
    - imo-creator-v2/workers/mission-control/src/data/navigation.ts (14 nav entries appended)
    - 16 × factory/<branch>/<NNN>-*/PROCESS-UT.md (§14 logbook + 3-location version bump)
    - 6 × factory/<branch>/<NNN>-*/PROCESS-UT.md (inside.heir.implements: appended)
    - imo-creator-v2/atlas/manifests/paired-artifacts.yaml (conditional append)
    - imo-creator-v2/fleet/specializations/throughput-control/SPECIALIZATION.md (PARTNER-RELAY placeholder)
    - docs/plans/BAR-FLEET-OVERNIGHT/audits/codex-audit-YYYYMMDD-HHMM.md (audit verdict)
    - LBB record (subject_id=system, tags=[bar-fleet-overnight, ...])

nodes:

  - id: master-conformance
    type: planner
    actor: opus-4.7
    inputs:
      - prior BARs (BAR-MONDAY-16-FLEET-GREEN, BAR-RIM-GATE-DRAFT)
      - audit Sonnet output (a57f0f541e0d0b5cd)
    outputs:
      - this Plan Book (PLAN-BOOK.md + plan-book.yaml)

  - id: WO-1-mc-nav-wiring
    type: mechanic
    actor: sonnet
    run_in_background: true
    target_repo: imo-creator-v2
    target_files:
      - workers/mission-control/src/data/navigation.ts
    inputs:
      - 14 process IDs (all 16 minus bp.100 + bp.600)
      - ctb_node mapping per process
    outputs:
      - +14 nav entries
      - MC built + deployed (wrangler pages deploy)
    verification:
      - grep -c "id: 'bp\." workers/mission-control/src/data/navigation.ts (+14 over baseline)
    schedule: post-Plan-Book

  - id: WO-2-ut-logbook-updates
    type: mechanic
    actor: sonnet
    run_in_background: true
    target_repo: Barton-Processes
    target_files:
      - 16 × factory/<branch>/<NNN>-*/PROCESS-UT.md
    inputs:
      - audit findings per process (Tables 1-4 from §3)
    outputs:
      - 16 × §14 logbook row appended (date=2026-05-10, BAR=BAR-FLEET-OVERNIGHT)
      - 16 × 3-location version bump (frontmatter + §1 Identity + §13 Document Control)
      - 16 × Last Modified updated to 2026-05-10 in all 3 locations
    verification:
      - git diff --stat factory/*/PROCESS-UT.md (16 files modified)
    schedule: post-Plan-Book

  - id: WO-3-rim-gate-adoption
    type: mechanic
    actor: sonnet
    run_in_background: true
    target_repo: Barton-Processes
    depends_on: WO-2
    target_files:
      - factory/cl/100-lcs-pipeline/PROCESS-UT.md
      - factory/outreach/201-email-discovery/PROCESS-UT.md
      - factory/outreach/202-linkedin-discovery/PROCESS-UT.md
      - factory/outreach/300-blog-worker/PROCESS-UT.md
      - factory/outreach/700-campaign-engine/PROCESS-UT.md
      - factory/client/820-vendor-export/PROCESS-UT.md
    inputs:
      - 6 RIM-GATE adoption candidates (Table 3 from §3)
    outputs:
      - 5 × inside.heir.implements = "rim-gate/throughput-control" (bp.100, 201, 202, 300, 700)
      - 1 × inside.heir.implements = "rim-gate/partner-relay" (bp.820)
      - 1 × PARTNER-RELAY placeholder in throughput-control SPECIALIZATION.md
      - paired-artifacts.yaml conditional append (if new pair rows)
    verification:
      - grep -rl "implements: rim-gate" factory/ (6 files)
    schedule: post-WO-2

  - id: WO-4-codex-audit
    type: auditor
    actor: codex
    run_in_background: true
    depends_on:
      - WO-1
      - WO-2
      - WO-3
    inputs:
      - git diff of changed files from WO-1, WO-2, WO-3
    outputs:
      - docs/plans/BAR-FLEET-OVERNIGHT/audits/codex-audit-YYYYMMDD-HHMM.md
      - P=1 or P=0 verdict with per-gate diagnostic
    verify:
      - BS Law v1.3.0 Y-junction on all modified Books
      - Book Law 11-block on companion YAMLs
      - 3-location version bumps consistent on each UT
      - 17 locked constants untouched (`git diff HEAD` empty)
      - RIM-GATE adoption syntactically correct
      - §14 logbook rows append-only
    schedule: post-build

  - id: WO-5-lbb-ingest
    type: mechanic
    actor: sonnet
    run_in_background: true
    depends_on: WO-4 (P=1 only)
    target: https://lbb.svg-outreach.workers.dev
    inputs:
      - audit verdict from WO-4
      - 5-WO completion log
      - 12-unknown walkthrough queue
    outputs:
      - 1 × LBB record (subject_id=system, tags=[bar-fleet-overnight, 16-process-sweep, session-2026-05-10])
    verification:
      - curl LBB records endpoint shows BAR-FLEET-OVERNIGHT row at top
    schedule: last

gates:
  total_gates: 6
  gate_ids: [G01, G02, G03, G04, G05, G06]
  gate_specs:
    G01: "WO-1 lands — 14 MC nav entries deployed + verified in MC live"
    G02: "WO-2 lands — 16 §14 logbook rows appended + 3-location version bumps applied"
    G03: "WO-3 lands — 6 implements: declarations applied + paired-artifacts.yaml conditionally updated"
    G04: "WO-4 returns P=1 — Codex audits bundle and certifies"
    G05: "WO-5 ingests — LBB row written under subject_id=system"
    G06: "Sovereign walkthrough — Dave reads §11 unknowns + issues decision batch"
  gate_failure_protocol:
    strike_1: "repair + re-audit"
    strike_2: "escalate to Opus 4.7 mechanic"
    strike_3: "Troubleshoot/Train — not another repair"

