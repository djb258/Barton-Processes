version: 1.0.0
date: "2026-05-04"
status: BUILD
purpose: "Tie Barton process UTs, workflow YAMLs, ORBT state, and Company Lifecycle/LCS source documents into one autonomy control plane."

company_lifecycle_sources:
  doctrine_lock: "../company-lifecycle-cl/docs/doctrine/COMPANY_LIFECYCLE_LOCK.md"
  downstream_handoff: "../company-lifecycle-cl/docs/handoff/DOWNSTREAM_SUB_HUB_HANDOFF.md"
  outreach_handoff: "../company-lifecycle-cl/docs/handoff/OUTREACH_HANDOFF.md"
  cl_doctrine: "../company-lifecycle-cl/docs/doctrine/CL_DOCTRINE.md"
  schema_index: "../company-lifecycle-cl/docs/schema/CL_SCHEMA_INDEX.md"
  lcs_prd: "../company-lifecycle-cl/docs/prd/PRD-LCS.md"
  insurance_informatics_ctb: "../company-lifecycle-cl/docs/INSURANCE-INFORMATICS-CTB.md"

autonomy_gate:
  required:
    - process_ut_exists
    - heir_yaml_exists
    - orbt_yaml_exists
    - workflow_yaml_exists_or_documentation_only
    - orbt_operate
    - company_lifecycle_source_resolved
    - no_red_audit_block
    - secrets_and_bindings_present
  allowed_states:
    auto_eligible: "May be run by Mission Control or cron without a human prompt."
    manual_gate: "Human or Foreman must approve before run."
    repair_required: "Do not run except targeted repair/audit commands."
    build_required: "Do not run as production automation."
    retired_or_tt: "Do not run; requires retirement or Troubleshoot/Train path."

processes:
  - id: bp.010
    name: SEED D1
    silo: outreach
    folder: factory/outreach/010-seed-d1
    process_ut: factory/outreach/010-seed-d1/PROCESS-UT.md
    workflow_yaml: factory/outreach/010-seed-d1/workflow.yaml
    heir_yaml: factory/outreach/010-seed-d1/heir.yaml
    orbt_yaml: factory/outreach/010-seed-d1/orbt.yaml
    cl_sources: [downstream_handoff, outreach_handoff]
    feeds: [bp.200, bp.400, bp.700, bp.100]
    orbt: OPERATE
    autonomy_state: auto_eligible

  - id: bp.100
    name: LCS Pipeline
    silo: cl
    folder: factory/cl/100-lcs-pipeline
    process_ut: factory/cl/100-lcs-pipeline/PROCESS-UT.md
    workflow_yaml: factory/cl/100-lcs-pipeline/workflow.yaml
    heir_yaml: factory/cl/100-lcs-pipeline/heir.yaml
    orbt_yaml: factory/cl/100-lcs-pipeline/orbt.yaml
    cl_sources: [lcs_prd, downstream_handoff, outreach_handoff]
    depends_on: [bp.200, bp.201, bp.202, bp.300, bp.301, bp.400, bp.500, bp.700]
    orbt: REPAIR
    autonomy_state: repair_required
    blocker: "Daily send path must clear BAR-375 schedule-spine interpretation and bp.100 repair gates."

  - id: bp.200
    name: People Worker
    silo: outreach
