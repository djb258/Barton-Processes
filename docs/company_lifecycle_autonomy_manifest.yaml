mission_control_contract:
  read_manifest: docs/company_lifecycle_autonomy_manifest.yaml
  show_layers:
    - process_ut
    - workflow_yaml
    - heir_yaml
    - orbt_yaml
    - cl_sources
    - autonomy_state
  allow_run_when: "autonomy_state == auto_eligible"
  deny_run_when:
    - repair_required
    - build_required
    - retired_or_tt
