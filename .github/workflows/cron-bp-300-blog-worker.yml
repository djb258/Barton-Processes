name: cron-bp-300-blog-worker

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Doppler CLI
        run: |
          curl -Ls https://cli.doppler.com/install.sh | sh -s -- --no-package-manager
          echo "$HOME/.doppler/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pip install -r factory/outreach/300-blog-worker/requirements.txt

      - name: Run blog worker
        run: doppler run --token "$DOPPLER_TOKEN" -- python factory/outreach/300-blog-worker/src/blog-monitor-v2.py
        continue-on-error: true
        id: run_script

      - name: Post LBB success log
        if: steps.run_script.outcome == 'success'
        run: |
          doppler run --token "$DOPPLER_TOKEN" -- bash -c '
            curl -s -X POST "https://lbb.svg-outreach.workers.dev/ingest" \
              -H "Authorization: Bearer $LBB_API_KEY" \
              -H "Content-Type: application/json" \
              -H "User-Agent: github-actions/bp.300" \
              -d '"'"'{"title":"bp.300 blog-worker run SUCCESS","subject_id":"svg-outreach-proc","orbt_mode":"OPERATE","content":"Cron run completed successfully.","source_type":"cron","source_name":"cron-bp-300-blog-worker"}'"'"'
          '

      - name: Post LBB failure squawk
        if: steps.run_script.outcome == 'failure'
        run: |
          doppler run --token "$DOPPLER_TOKEN" -- bash -c '
            curl -s -X POST "https://lbb.svg-outreach.workers.dev/ingest" \
              -H "Authorization: Bearer $LBB_API_KEY" \
              -H "Content-Type: application/json" \
              -H "User-Agent: github-actions/bp.300" \
              -d '"'"'{"title":"bp.300 blog-worker run FAILURE","subject_id":"svg-outreach-proc","orbt_mode":"REPAIR","content":"Cron run failed. Check GitHub Actions logs. Note: FP-300-01 version sprawl unresolved — blog-monitor-v2.py used as canonical pending sovereign pick.","source_type":"cron","source_name":"cron-bp-300-blog-worker"}'"'"'
          '

      - name: Always exit 0 (Aviation Model — squawk logged, do not block)
        run: exit 0
