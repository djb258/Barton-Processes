name: cron-bp-202-linkedin-discovery

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r factory/outreach/202-linkedin-discovery/requirements.txt

      - name: Run LinkedIn discovery
        env:
          LBB_API_KEY: ${{ secrets.LBB_API_KEY }}
        run: python factory/outreach/202-linkedin-discovery/src/find-linkedin.py

      - name: Post LBB success log
        if: success()
        env:
          LBB_API_KEY: ${{ secrets.LBB_API_KEY }}
        run: |
          curl -s -X POST "https://lbb.svg-outreach.workers.dev/ingest" \
            -H "Authorization: Bearer $LBB_API_KEY" \
            -H "Content-Type: application/json" \
            -H "User-Agent: github-actions/bp.202" \
            -d '{"title":"bp.202 linkedin-discovery run SUCCESS","subject_id":"svg-outreach-proc","orbt_mode":"OPERATE","content":"Cron run completed successfully.","source_type":"cron","source_name":"cron-bp-202-linkedin-discovery"}'

      - name: Post LBB failure log
        if: failure()
        env:
          LBB_API_KEY: ${{ secrets.LBB_API_KEY }}
        run: |
          curl -s -X POST "https://lbb.svg-outreach.workers.dev/ingest" \
            -H "Authorization: Bearer $LBB_API_KEY" \
            -H "Content-Type: application/json" \
            -H "User-Agent: github-actions/bp.202" \
            -d '{"title":"bp.202 linkedin-discovery run FAILURE","subject_id":"svg-outreach-proc","orbt_mode":"REPAIR","content":"Cron run failed. Check GitHub Actions logs.","source_type":"cron","source_name":"cron-bp-202-linkedin-discovery"}'

      - name: Always exit 0 (Aviation Model — squawk logged, do not block)
        if: always()
        run: exit 0
