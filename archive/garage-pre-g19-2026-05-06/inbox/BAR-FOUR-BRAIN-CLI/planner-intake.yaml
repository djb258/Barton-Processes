name: bar-four-brain-cli-planner-intake
version: "1.0.0"
status: READY_FOR_PLANNER
last_modified: "2026-05-05"
paired_md: PLANNER-INTAKE.md
purpose: >
  Process 070 Planner intake packet for BAR-FOUR-BRAIN-CLI. Builds the
  four-brain pipeline runtime per PROC-070 §11 OUT OF SCOPE spec —
  D1 migration 0019_four_brain_run.sql, mission-control-api four-brain
  routes, forebrain-garage.sh refactor, and end-to-end smoke test.
  PROC-070 doctrine is the source of truth; this BAR builds runtime that
  conforms.

planner_request:
  bar_or_work_id: BAR-FOUR-BRAIN-CLI
  target_process: "PROC-070 / bp.070-four-brain / four-brain pipeline runtime"
  desired_outcome: >
    Refactor the four-brain runner so each agent (planner, foreman, mechanic,
    auditor) has its own inbox/outbox queue backed by D1 in mission-control-api.
    Hand-offs become automatic — when one agent finishes, the next agent's
    inbox row appears and that agent claims it. Replaces the current shared
    garage/runs/{BAR}/{ts}/ filesystem state machine for queue/state telemetry
    while retaining the run dir for durable artifacts (Plan Books, UT Books,
    Audit Books).
  operating_mode: BUILD
  due_or_timing: "no deadline, sovereign-paced"
  sovereign_decision_needed: "yes — see §19 (3 open questions)"

source_of_truth_split:
  blueprint_architecture:
    owner: "imo-creator-v2 atlas + Barton-Processes 070 doctrine"
    paths:
      - imo-creator-v2/atlas/constants/FOUR_BRAIN_AVIATION.md
      - Barton-Processes/factory/imo-creator/070-four-brain/PROCESS-UT.md
      - Barton-Processes/factory/imo-creator/070-four-brain/four-brain.yaml
    owns: "Pipeline doctrine — role separation, gate spec, table column specs, migration filename. Locked; this BAR does not change."
  execution_operations:
    owner: "Barton-Processes 070 runner"
    paths:
      - Barton-Processes/factory/imo-creator/070-four-brain/garage/forebrain-garage.sh
    owns: "Runner state machine. Refactored to call new API routes instead of writing local YAML status."
  runtime_deployment:
    owner: "imo-creator-v2 mission-control-api"
    paths:
      - imo-creator-v2/workers/mission-control-api/
      - imo-creator-v2/workers/mission-control-api/migrations/0019_four_brain_run.sql
    owns: "Worker that hosts the D1-backed queue. Adds four-brain-specific routes alongside generic /inbox."
  evidence_observability:
    owner: "mission-control D1 + LBB"
    paths:
      - "mission-control.four_brain_run"
      - "mission-control.four_brain_transition"
      - "mission-control.squawks"
      - "lbb.records"
      - "lbb.logbook"
    owns: "Queue state, role transitions, gate verdicts, Audit Books, CERTIFY rows."

outside:
  bs_law_arm: outside_dewey
  book_law_species: Workflow-Body
  heir:
    sovereign_ref: imo-creator
    hub_id: bar-four-brain-cli-planner-intake
    ctb_placement: barton-enterprises/imo-creator/processes/four-brain/bar-four-brain-cli
    imo_topology: input
    cc_layer: CC-02
    services:
      - Barton-Processes
      - imo-creator-v2 atlas
      - Process 070 Four-Brain
      - mission-control-api worker
      - mission-control D1
      - LBB
    secrets_provider: doppler
    acceptance_criteria: >
      Planner can build a Plan Book that produces (1) migration
      0019_four_brain_run.sql applied locally + remote, (2) mission-control-api
      four-brain routes, (3) forebrain-garage.sh refactored to use the new
      routes, (4) smoke-test BAR producing exactly 4 LBB rows + 1 Audit Book
      + CERTIFY row + 0 unresolved squawks, (5) Codex VERDICT P=1 on all 10
      gates from four-brain.yaml Block 11.
    species: Workflow-Body
  orbt:
    library_state: BUILD
    indexed_by: codex

inside:
  bs_law_arm: inside_fractal
  heir:
    process_id: bp.070-four-brain.bar-four-brain-cli-intake
    parent_process: bp.070-four-brain
    output_type: planner_intake_packet
    aviation_model:
      planner: opus-4.7
      foreman: opus-4.7
      mechanic: sonnet
      auditor: codex
      rule: "mechanic != auditor"
    determinism_gate: "ai_on_spine_forbidden"
  orbt:
    runtime_state: BUILD
    promotion_gate: "sovereign signs Plan Book; smoke test PASSES on Codex audit"
    strikes: 0

