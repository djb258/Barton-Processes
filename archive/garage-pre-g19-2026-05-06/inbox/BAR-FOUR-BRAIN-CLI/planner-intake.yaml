sovereign_resolutions:
  signed_at: "2026-05-05"
  signer: "Dave Barton"
  resolutions:
    - id: Q1
      question: "Mid-flight BAR-FCE-RUN-060-PLANNER: finish under OLD runner first, OR roll its state into the new system?"
      resolution: "Leave 060 alone. This BAR is greenfield. BAR-FCE-RUN-060-PLANNER continues on the old runner. The new runtime does not touch its state."
      cite: "Sovereign 2026-05-05"
    - id: Q2
      question: "Atlas amendment scope: is this BAR allowed to amend atlas/ATLAS.md?"
      resolution: "NO. This BAR may not touch atlas/ATLAS.md. Any registry updates are a follow-up BAR. G09 stays at 16 read-only locked constants for this BAR specifically — atlas/ATLAS.md is added to the no-modify set just for BAR-FOUR-BRAIN-CLI."
      cite: "Sovereign 2026-05-05"
    - id: Q3
      question: "Strike-ladder routing logic — where does it live?"
      resolution: "Foreman role owns the routing decision; runner is the invocation host. Foreman reads strike-count from D1 and decides which mechanic to invoke (Sonnet → Opus 4.7 → Troubleshoot/Train). The runner hosts Foreman invocation and provides strike-count from the four_brain_run D1 row. Worker does not make the decision; it stores data only."
      cite: "Sovereign 2026-05-05; doctrine: FOUR_BRAIN_AVIATION.md §STRIKE SYSTEM lines 196-204 + PROC-070 §4 Step 6 + memory feedback_auditor_decides_pass_fail.md"

