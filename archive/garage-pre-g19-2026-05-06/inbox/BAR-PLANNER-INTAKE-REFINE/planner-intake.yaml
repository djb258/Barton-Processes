    fail: "VERDICT: P=0"

p1_definition:
  conditions:
    - "PLANNER-INTAKE-TEMPLATE.md (variable fill only) updated to incorporate every sovereign-accepted gap (G-01 through G-18) from LBB record 090520d7-ff64-4b6e-9e14-5e8928b24db7 §8; version bumped from 1.0.0 to next; skeleton unchanged"
    - "planner-intake-template.yaml updated in lock-step, BS Law Y-junction conformant, version matching markdown"
    - "PROCESS-UT.md (variable fill within 14-section skeleton + 13-item UT_CHECKLIST) updated to reflect new template version; Maintenance Logbook §14 row appended; version bumped"
    - "four-brain.yaml updated lock-step with PROCESS-UT.md"
    - "Corresponding four-brain UT in imo-creator-v2 (Planner identifies + sovereign confirms exact file) updated to reflect new template version; skeleton unchanged; locked constants NOT modified"
    - "G-15 lock: pinned_atlas_version + pinned_gate_spec_version fields present and required in Plan-Body species; downstream roles read pinned versions only"
    - "G-16 lock: plan_book_ttl_hours field present and required in Plan-Body; Foreman re-validation hook implemented (forebrain-garage.sh or equivalent) to detect stale Plan Books past TTL"
    - "G-17 lock: file-level concurrency check at Foreman dispatch — overlapping allowed_write_scope between in-flight BARs is blocked OR routed to a conflict-resolution queue. Implementation in forebrain-garage.sh + a bar_locks tracking surface (D1 table or file-based)"
    - "G-18 lock: every gate in four-brain-doctrine-gate.yaml has a deterministic predicate (regex / hash / file-existence / git-diff / JSON-schema). Gates requiring LLM judgment marked requires_llm_tail=true with deterministic fallback test"
    - "G-19 lock: NO sovereign approval gates between Planner→Foreman→Mechanic→Auditor. The only sovereign touchpoints are (a) template-drop into inbox (input boundary) and (b) reading the Auditor verdict (output boundary). All intermediate stage transitions auto-advance on stage success and route through Strike system on stage failure. Mission Control surfaces stage-to-stage handoffs as observation only — no approve/reject buttons between Planner and Auditor. Garage statuses like REVIEW_PLAN_BOOK or REVIEW_DIFF that imply sovereign gating must be removed; replaced with PLAN_BOOK_READY → FOREMAN_DISPATCHED auto-transition, MECHANIC_RUNNING → AUDIT_RUNNING auto-transition, etc. Implementation: forebrain-garage.sh advances status mechanically on stage exit code 0; sovereign sees the transition but is not asked for input."
    - "Codex VERDICT: P=1 against gates BS Law / Workflow-Body or UT-Body conformance / scope / aviation / evidence — applied to ALL artifacts"
    - "Skeleton invariant verified: section headers, ordering, required UT_CHECKLIST items match v1.3.1 14-section format on every modified UT"
    - "Sovereign reviews and signs the locked version of the TEMPLATE (intake-side), not intermediate Plan/UT/Audit Books produced by the pipeline"
    - "4 LBB transition rows minimum (planner / foreman / mechanic / auditor)"
    - "CERTIFY row in lbb.logbook"
    - "FINAL-PRODUCT.yaml at outbox/BAR-PLANNER-INTAKE-REFINE/ pointing to ALL refined artifacts"

open_questions:
