    question: "Build sub-mode (discovery/declared/maintenance) — separate field on template, or sub-enum under Operating Mode?"
    blocks_planning: true
    sovereign_call: true
  - id: Q-02
    question: "Maintenance-schedule-at-build-time requirement — part of THIS template refinement, or separate Plan-Body / Book Law amendment BAR?"
    blocks_planning: true
    sovereign_call: true
  - id: Q-03
    question: "Strike counter location — augment mission-control.squawks or new strike_tally D1 table?"
    blocks_planning: false
    note: "Out-of-scope for this BAR; flag so refined template's root_cause_hash field stays neutral"
  - id: Q-04
    question: "Operational events as new species (Event-Body) or extension of Data-Body?"
    blocks_planning: false
    note: "Out-of-scope; refined template stays neutral on operational book species"

