bar_intake:
  bar_or_work_id: BAR-PLANNER-INTAKE-REFINE
  target_process: PROC-070 / Four-Brain Aviation Model — Template Refinement + Downstream UT Sync
  target_artifacts:
    - path: Barton-Processes/factory/imo-creator/070-four-brain/PLANNER-INTAKE-TEMPLATE.md
      role: primary (template skeleton being refined)
    - path: Barton-Processes/factory/imo-creator/070-four-brain/planner-intake-template.yaml
      role: paired_yaml (lock-step with primary)
    - path: Barton-Processes/factory/imo-creator/070-four-brain/PROCESS-UT.md
      role: downstream_ut_sync (PROC-070 operating manual reflects new template version)
    - path: Barton-Processes/factory/imo-creator/070-four-brain/four-brain.yaml
      role: paired_yaml (lock-step with PROCESS-UT)
    - path: imo-creator-v2/<TBD-four-brain-UT-path>
      role: imo_creator_four_brain_ut_sync
      planner_resolves: true
      note: "Planner identifies the exact non-locked artifact in imo-creator-v2 documenting the four-brain. Sovereign confirms. Locked constants are NOT eligible."
  desired_outcome: >
    Three artifacts updated in lock-step: (1) PLANNER-INTAKE-TEMPLATE.md +
    paired YAML; (2) PROC-070 PROCESS-UT.md + four-brain.yaml; (3) the
    corresponding four-brain UT in imo-creator-v2. All three reflect the
    sovereign-accepted gaps from LBB record 54214381-4d34-4717-8284-6407c483d21a.
    Skeleton (14-section UT format + 13-item UT_CHECKLIST + BS Law Y-junction)
    is CONSTANT and unchanged. Variable fill is what updates.
  skeleton_invariant: >
    Per Atlas C&V Test: UT skeleton (sections, ordering, required fields per
    UT_CHECKLIST v1.3.1, paired-artifact .md/.yaml structure, Book Law species
    declarations) is a CONSTANT. The specific content filling each section is
    a VARIABLE. Mechanic edits variables only — never restructures skeletons.
    Auditor verifies skeleton integrity at audit time.
  operating_mode: BUILD
  build_sub_mode: maintenance
  build_sub_mode_justification: >
    Existing template at v1.0.0 is the baseline; this BAR is a delta against
    it, not a new structure to discover. Sovereign already approved that the
    Aviation Model framework is correct; we are filling in fields, not
    reconceiving the template.
  due_or_timing: no deadline; sovereign reviews and signs at next session
  sovereign_decision_needed: >
    Yes. Sovereign must decide each of gaps G-01 through G-14 (accept / reject)
    and resolve open questions Q-01 through Q-04 in the LBB record.

