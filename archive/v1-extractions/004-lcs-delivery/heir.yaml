# Process HEIR — 004-lcs-delivery
process_id: "PROC-LCS-DELIVERY"
process_number: "004"
name: "LCS Delivery"
source_repo: "company-lifecycle-cl"
source_paths:
  - "src/app/lcs/"
runtime: "typescript"
status: "extracted"

description: >
  Delivery runner, delivery queue, adapters (mailgun, heyreach,
  sales-handoff), id-minter, pipeline orchestrator + 7 steps.
  The end-to-end delivery pipeline for lifecycle communications.

dependencies:
  databases:
    - schema: "lcs"
      tables: ["signal_queue", "event", "err0"]
      access: "READ/WRITE"
    - schema: "cl"
      tables: ["company_identity"]
      access: "READ"
  apis:
    - "Mailgun"
    - "HeyReach"
  secrets:
    - "NEON_CONNECTION_STRING"
    - "DOPPLER_TOKEN"
    - "MAILGUN_API_KEY"
    - "HEYREACH_API_KEY"

imo:
  ingress:
    trigger: "Signal bridge events from LCS Runtime"
    schema: "lcs.signal_queue with intelligence assembly via v_company_intelligence"
  egress:
    outputs:
      - "lcs.event (Canonical Event Table)"
      - "v_company_lifecycle_status view"
      - "v_company_promotable view"
    consumers: ["barton-outreach-core", "sales", "client"]

orbt:
  mode: "BUILD"
  health: "YELLOW"
  notes: "LCS v2.2.0 active — signal queue + frame registry wired, adapter delivery in integration testing"

log_targets:
  - "log/004-lcs-delivery/"

dashboard_ref: "PROC-LCS"
