# Process HEIR — 001-neon-db-agent
process_id: "PROC-NEON-DB-AGENT"
process_number: "001"
name: "Neon DB Agent"
source_repo: "company-lifecycle-cl"
source_paths:
  - "neon/"
  - "neon/agent/"
runtime: "node"
status: "extracted"

description: >
  Neon CLI agent + DB scripts — identity gate, domain verification,
  collision detection, migration runners, schema verification.
  Core database management tooling for the CL hub.

dependencies:
  databases:
    - schema: "cl"
      tables: ["company_candidate", "company_identity", "company_identity_bridge"]
      access: "READ/WRITE"
    - schema: "lcs"
      tables: ["signal_queue", "event", "err0"]
      access: "READ/WRITE"
  apis: []
  secrets:
    - "NEON_CONNECTION_STRING"
    - "DOPPLER_TOKEN"

log_targets:
  - "log/001-neon-db-agent/"

dashboard_ref: "PROC-LCS"
