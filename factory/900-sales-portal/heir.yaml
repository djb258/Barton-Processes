# HEIR — 900 Sales Portal
process_id: "PROC-SALES-PORTAL"
process_number: "900"
name: "Sales Portal"
blueprint_owner: "ctb-sales-navigator"
runtime: "cloudflare-workers"
status: "build"
sovereign_ref: "imo-creator-v2"
governing_engine: "law/doctrine/TIER0_DOCTRINE.md"
ctb_placement: "leaf"
cc_layer: "CC-04"
imo_topology: "egress"

services:
  - "CF Worker (HTTP)"
  - "D1 (sales working tables + outreach read)"
secrets_provider: "doppler"

two_question_intake:
  what_triggers: "User navigates to app.svgagency.com/sales/:slug/:meeting"
  how_do_we_get_it: "Resolve slug to sales_id from D1, query meeting data, render page"

pages:
  - {route: "/:slug/meeting1", name: "Fact Finder", access: "read-write"}
  - {route: "/:slug/meeting2", name: "Insurance Education", access: "read-only"}
  - {route: "/:slug/meeting3", name: "Systems Education", access: "read-only"}
  - {route: "/:slug/meeting4", name: "Financials", access: "read-only"}

data_sources:
  meeting1_pulls_from:
    - "outreach.company_target (company profile)"
    - "outreach.dol (DOL filings, EIN, carrier, renewal month)"
    - "people.company_slot + people.people_master (CEO/CFO/HR contacts)"
    - "outreach.blog (content signals)"
    - "outreach.bit_scores (buyer intent score)"
  meeting2_reads: "sales.sales_factfinder + monte_carlo_results (future)"
  meeting3_reads: "sales.sales_systems"
  meeting4_reads: "sales.sales_quotes"

acceptance_criteria:
  - "Meeting 1 pre-populates form from outreach 5 sub-hubs via sovereign ID"
  - "Meeting 1 form writes validated data to sales.sales_factfinder in D1"
  - "Meetings 2-4 are read-only presentation pages"
  - "Meeting 2 will display Monte Carlo results when built"
  - "Meeting 4 shows quoted costs by insurance line"
  - "All pages branded per prospect"

depends_on: [200, 600]  # People Worker + BIT Scoring feed outreach data
feeds: []
