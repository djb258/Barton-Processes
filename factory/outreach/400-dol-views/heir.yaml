# HEIR — 400 DOL Views
# NOT a worker. A reference library with query views.
# Annual import is manual (EBSA download). This just defines the views.
process_id: "PROC-DOL"
process_number: "400"
name: "DOL Views"
blueprint_owner: "barton-outreach-core"
runtime: "sql-views"  # Not a CF Worker — just views in Neon
status: "build"
sovereign_ref: "imo-creator-v2"
ctb_placement: "leaf"
cc_layer: "CC-04"
imo_topology: "egress"  # Read-only views against static data

services:
  - "Neon PostgreSQL (direct — no worker needed)"
secrets_provider: "doppler"

snap_on_tools: []  # No external tools. Direct Neon queries.
ut_sub_hubs: []

data_volumes:
  ein_matches: "1.4M (entire US)"
  form_5500_rows: "11M+ (2023-2025)"
  linked_to_ct: "partial subset of 96K"

movement_detection:
  type: "deterministic"
  ai_required: false
  method: "Compare filing years — renewal, premium, carrier, broker changes"
  output: "0 (no actionable change) or 1 (movement)"
  signals: ["RENEWAL_APPROACHING", "PREMIUM_INCREASE", "CARRIER_CHANGE", "BROKER_CHANGE", "PLAN_CHANGE", "OVERPAYING"]

views_to_build:
  - "v_dol_renewal_window — companies approaching renewal (Gate 4)"
  - "v_dol_premium_pressure — YoY cost increase (Gate 5)"
  - "v_dol_market_comparison — PEPM by state/carrier for competitive analysis"
  - "v_dol_filing_status — which companies have filings (Gate 3)"
  - "v_dol_carrier_changes — carrier instability signal"
  - "v_dol_broker_changes — broker churn signal"

acceptance_criteria:
  - "All views query-able from CF Worker via Hyperdrive"
  - "Gate 3/4/5 can evaluate using these views"
  - "PEPM benchmarking by state/size available"

depends_on: []  # Independent — static data
feeds: [600, 100]  # BIT, LCS
