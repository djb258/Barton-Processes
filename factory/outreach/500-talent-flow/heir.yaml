# HEIR — 500 Talent Flow
# Reads People snapshots. Detects executive movement. Depends on 200.
process_id: "PROC-TALENT-FLOW"
process_number: "500"
name: "Talent Flow"
blueprint_owner: "barton-outreach-core"
runtime: "cloudflare-workers"
status: "build"
sovereign_ref: "imo-creator-v2"
ctb_placement: "leaf"
cc_layer: "CC-04"
imo_topology: "spoke"

services:
  - "CF Worker (monthly cron — runs AFTER 200-people-worker)"
  - "Neon via Hyperdrive"
secrets_provider: "doppler"

snap_on_tools:
  - {id: "TOOL-003", name: "LinkedInCheck", tier: "free"}
  - {id: "TOOL-005", name: "ScraperAPI", tier: "cheap"}

ut_sub_hubs: ["16-fetcher", "18-proxy-router", "20-cache-layer"]

movement_detection:
  type: "deterministic"
  ai_required: false
  method: "Compare People snapshot month-over-month. Slot changes = executive movement."
  output: "0 or 1 per slot"
  signals: ["EXECUTIVE_JOINED", "EXECUTIVE_LEFT"]
  note: "This is the People movement detection applied specifically to executive-level slots"

acceptance_criteria:
  - "Runs AFTER 200-people-worker completes monthly refresh"
  - "Compares current vs previous People snapshot"
  - "Emits BIT signals for executive movement"
  - "Errors write to master error table (D1)"

depends_on: [200]  # MUST run after People worker
feeds: [600, 100]  # BIT, LCS
bars: ["BAR-50"]
