# Block 7 — description
description: "Monthly movement detection engine for bp.500 Talent Flow. Diffs people_slots history snapshots (current vs prior period), classifies executive movement (title change, departure, new hire), writes to talent_movement table, and emits TALENT signals into lcs_signal_queue for downstream bp.100 LCS Pipeline and bp.700 Campaign Engine. No AI — pure snapshot diff."

# Block 8 — inputs (Book Law v1.5.0 — 11 mandatory blocks)
inputs: { bar_id: BAR-377, process_ut: PROCESS-UT.md, doctrine: DOCTRINE.md, heir: heir.yaml, orbt: orbt.yaml }

# Block 9 — schedule
schedule:
  - cron: "0 8 1 * *"
    label: monthly-talent-scan
    dependency: bp.200-must-have-two-consecutive-snapshots

# Block 10 — data
data:
  reads:
    - people.linkedin_snapshots
    - people.people_master
    - people.company_slot
  writes:
    - outreach.signal_output
    - lcs_signal_queue
  forbidden:
    - llm_on_schedule_spine
    - llm_inference_on_movement_detection
    - skip_bp_200_snapshot_gate
    - modify_locked_doctrine

# Block 11 — nodes
nodes:
  - { id: preflight, brain: deterministic, action: verify-bp200-two-consecutive-snapshots }
  - { id: snapshot-diff, brain: deterministic, action: diff-current-vs-prior-period }
  - { id: classify-movement, brain: deterministic, action: classify-title-change-departure-new-hire }
  - { id: write-talent-movement, brain: deterministic, output: talent_movement-table }
  - { id: emit-signals, brain: deterministic, output: lcs_signal_queue-signal_category-TALENT }
  - { id: stop-check, brain: deterministic, action: zero-detections-two-cycles-check }
  - { id: lbb-mc-closeout, brain: deterministic, depends_on: [emit-signals] }

# Block 12 — gates + lbb
gates:
  cron_exists: "monthly cron 0 8 1 * * declared and registered"
  cron_firing: "recent fire or verified operator-trigger record exists"
  no_ai_on_schedule_spine: "no LLM/API model calls on the detection or signal spine"
  ut_ops_matches_reality: "PROCESS-UT operations match live trigger and Neon surface"
  lbb_ingest_each_fire: "lbb_records contains bp.500 run rows"
  orbt_promoted_or_confirmed: "orbt.yaml remains OPERATE after Codex audit"
  neon_surface_documented: "people.linkedin_snapshots and people.company_slot checks pass"
  upstream_healthy: "bp.200 is OPERATE with two consecutive snapshots available"
  downstream_wired: "bp.100 LCS Pipeline consumes TALENT signals; bp.700 sequences on them"
  squawk_live: "zero-detection two-cycle trip writes mission-control squawk"

lbb:
  subject_id: svg-outreach-proc
  title_prefix: "bp.500 Talent Flow"
  ingest_on_pass: true
  ingest_on_fail: true
