# ═══════════════════════════════════════════════════════════════
# Process 200 — People Worker v2
# ═══════════════════════════════════════════════════════════════
# Four passes (well drinks first):
#   Pass 0: Promote intake_people_staging (FREE)
#   Pass 1: Scrape about/team pages (FREE, CF fetch)
#   Pass 2: Startpage search via DataImpulse proxy (TOP SHELF)
#   Pass 3: Movement detection (MONTHLY)
#
# D1_OUTREACH: reads/writes people slots, people master, staging
# D1_SPINE: read-only for cl_company_identity.canonical_name
# No Neon during WORK phase.
# ═══════════════════════════════════════════════════════════════

name = "people-worker-200"
main = "src-v2/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Daily cron — runs Pass 0 first (free), then Pass 2 if staging exhausted
[triggers]
crons = ["0 6 * * *"]

# Outreach D1 — all working data (reads/writes)
[[d1_databases]]
binding = "D1_OUTREACH"
database_name = "svg-d1-outreach-ops"
database_id = "73a285b8-770a-4370-abbe-ce9607be0b34"

# Spine D1 — READ ONLY (company name from cl_company_identity)
[[d1_databases]]
binding = "D1_SPINE"
database_name = "svg-d1-spine"
database_id = "641a9a1e-0882-41a7-82af-ea700e7cfbb3"

[vars]
# Profiles per cron invocation
BATCH_SIZE = "100"
# Delay between proxy fetches (ms) — Box-Muller jitter within range
# Updated 2026-03-31: sticky session is stable, reduced from 30s/120s
MIN_DELAY_MS = "3000"
MAX_DELAY_MS = "8000"

# DataImpulse proxy credentials — UPDATED (2026-03-31):
#   PROXY_HOST = gw.dataimpulse.com
#   PROXY_PORT = 10000 (sticky session — NOT 823 rotating)
#   PROXY_USER = {user}__cr.us (US country targeting appended at runtime)
#   PROXY_PASS = (from Doppler imo-creator/dev)
#   Method: POST form to Startpage (not GET — prevents CAPTCHA)
#   Fix proven 2026-03-31: all 5 test queries passed
