# HEIR — 200 People Worker
# Monthly dumb worker. Fills CEO/CFO/HR slots. Detects movement (0/1).
process_id: "PROC-PEOPLE"
process_number: "200"
name: "People Worker"
blueprint_owner: "barton-outreach-core"
runtime: "cloudflare-workers"
status: "build"
sovereign_ref: "imo-creator-v2"
ctb_placement: "leaf"
cc_layer: "CC-04"
imo_topology: "spoke"  # Dumb worker — ingress spoke feeding CID

services:
  - "CF Worker (monthly cron)"
  - "Neon via Hyperdrive"
  - "Composio → Hunter"
  - "Composio → Apollo"
  - "Composio → MillionVerifier"
  - "CF fetch → MX/SMTP/LinkedIn (free tools)"
secrets_provider: "doppler"

snap_on_tools:
  - {id: "TOOL-001", name: "MXLookup", tier: "free"}
  - {id: "TOOL-002", name: "SMTPCheck", tier: "free"}
  - {id: "TOOL-003", name: "LinkedInCheck", tier: "free"}
  - {id: "TOOL-008", name: "Hunter", tier: "surgical"}
  - {id: "TOOL-009", name: "Apollo", tier: "surgical"}
  - {id: "TOOL-010", name: "MillionVerifier", tier: "surgical"}

ut_sub_hubs: ["21-dedup", "23-rate-limiter"]

movement_detection:
  type: "deterministic"
  ai_required: false
  method: "slot-by-slot snapshot diff"
  output: "0 (no change) or 1 (movement)"
  signals: ["JOINED", "LEFT", "REPLACED", "TITLE_CHANGED", "EMAIL_CHANGED"]

acceptance_criteria:
  - "Monthly snapshot compared to previous month"
  - "Binary movement gate per slot per company"
  - "Verified emails in slots → SID has a recipient"
  - "Errors write to master error table (D1)"

depends_on: []  # Independent — reads from CT
feeds: [500, 600, 100]  # Talent Flow, BIT, LCS
