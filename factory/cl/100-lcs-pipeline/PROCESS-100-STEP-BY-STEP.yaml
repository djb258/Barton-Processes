  book_law_species: Workflow-Body
  spine_content: "Library-facing HEIR/ORBT coordinates for finding and governing this artifact."
  heir:
    sovereign_ref: company-lifecycle
    hub_id: outreach
    ctb_placement: barton-enterprises/company-lifecycle/outreach/process-100
    imo_topology: middle
    cc_layer: CC-02
    services:
      - Cloudflare Workers
