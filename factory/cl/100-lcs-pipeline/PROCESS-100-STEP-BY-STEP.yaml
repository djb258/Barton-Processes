inside:
  bs_law_arm: inside_fractal
  book_law_species: Workflow-Body
  spine_content: "Runtime-facing HEIR/ORBT coordinates for navigating and auditing Process 100."
  heir:
    process_id: bp.100
    process_number: "100"
    process_name: LCS Pipeline
    source_ut: PROCESS-UT.md
    companion_manifest: PROCESS-100-STEP-BY-STEP.md
    aviation_model:
      planner: four-brain-planner
      foreman: sonnet
      mechanic: sonnet
      auditor: codex
      rule: "builder != auditor"
    doctrine_gate:
      key: "C:/Users/CUSTOM PC/Desktop/Cursor Builds/imo-creator-v2/atlas/constants/KEY.md"
      bs_law: "C:/Users/CUSTOM PC/Desktop/Cursor Builds/imo-creator-v2/atlas/constants/BS_LAW.md"
      structure_manifest: "C:/Users/CUSTOM PC/Desktop/Cursor Builds/imo-creator-v2/atlas/manifests/STRUCTURE_MANIFEST.yaml"
  orbt:
    runtime_state: REPAIR
    promotion_target: OPERATE
    p_equals_1_when:
