# HEIR — 820 Vendor Export
process_id: "PROC-VENDOR-EXPORT"
process_number: "820"
name: "Vendor Export"
blueprint_owner: "client"
runtime: "cloudflare-workers"
status: "build"
sovereign_ref: "imo-creator-v2"
governing_engine: "law/doctrine/TIER0_DOCTRINE.md"
ctb_placement: "leaf"
cc_layer: "CC-04"
imo_topology: "egress"

services:
  - "CF Worker (cron + HTTP)"
  - "D1 (read canonical working tables)"
  - "KV (vendor blueprint mappings)"
secrets_provider: "doppler"

two_question_intake:
  what_triggers: "Cron schedule or manual trigger"
  how_do_we_get_it: "Read D1 canonical working tables"

export_schedule:
  daily: ["TPA", "PBM"]
  weekly: ["Guardian Life", "Mutual of Omaha"]

acceptance_criteria:
  - "Reads from D1 canonical tables only"
  - "Applies vendor blueprint mapping from KV"
  - "Translates internal UUIDs to external IDs"
  - "Logs every export to export_log"
  - "Missing external ID mapping logs error, skips record"
  - "Daily exports for TPA/PBM, weekly for carriers"

depends_on: [810]
feeds: []
