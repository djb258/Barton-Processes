# HEIR — 820-vendor-export
# 8-field standard format. Stamped at build. Never changes core fields.

sovereign_ref: "imo-creator-v2"
hub_id: "vendor-export-820"
ctb_placement: "barton-enterprises/svg-agency/client/820-vendor-export"
imo_topology: "egress"
cc_layer: "CC-04"

services:
  - "CF Worker (cron trigger 0 5 * * * + HTTP endpoints)"
  - "D1: vendor-export-820 (export_log, export_error, export_schedule)"
  - "D1: 810 canonical read-only (person, election, plan, vendor, external_identity_map)"
  - "KV: vendor blueprint mappings (blueprint:{vendor_id})"

secrets_provider: "doppler"

acceptance_criteria:
  - "Reads from D1 canonical tables owned by 810 only — never writes to 810 tables"
  - "Vendor blueprint field mapping loaded from KV at blueprint:{vendor_id} for every run"
  - "Internal UUIDs translated to vendor external IDs via external_identity_map before output"
  - "Every export run writes a row to export_log with record_count, status, exported_at"
  - "Missing external ID mapping logs MISSING_EXTERNAL_ID to export_error and skips record"
  - "TPA and PBM export daily; Guardian Life and Mutual of Omaha export weekly on WEEKLY_DAY"
