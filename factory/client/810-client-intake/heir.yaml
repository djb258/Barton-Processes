# HEIR — 810 Client Data Intake
process_id: "PROC-CLIENT-DATA-INTAKE"
process_number: "810"
name: "Client Data Intake"
blueprint_owner: "client"
runtime: "cloudflare-workers"
status: "build"
hub_id: "client-intake-810"
sovereign_ref: "imo-creator-v2"
governing_engine: "law/doctrine/TIER0_DOCTRINE.md"
ctb_placement: "leaf"
cc_layer: "CC-04"
imo_topology: "middle"

services:
  - "CF Worker (HTTP endpoint)"
  - "Neon via Hyperdrive"
  - "D1 (staging + working tables)"
secrets_provider: "doppler"

two_question_intake:
  what_triggers: "Operator uploads CSV or external system POSTs data"
  how_do_we_get_it: "HTTP endpoint on CF Worker accepts payload"

spoke_routing:
  s2_plan: ["plan", "plan_quote"]
  s3_employee: ["person", "election", "enrollment_intake", "intake_record"]
  s4_vendor: ["vendor", "external_identity_map", "invoice"]
  s5_service: ["service_request"]

acceptance_criteria:
  - "Zod validates all incoming data at boundary"
  - "Rejected data never enters staging"
  - "Staging tables are INSERT-only (intake_record immutable)"
  - "Promotion validates business rules before writing canonical"
  - "Errors write to spoke-specific error tables in D1"
  - "Same worker handles initial load and incremental updates"
  - "Vault promotion pushes certified records to Neon"

depends_on: [800]
feeds: [820]
