# Process HEIR — 007-people-intel
process_id: "PROC-PEOPLE-ENRICH"
process_number: "007"
name: "People Enrichment"
short_name: "PE"
source_repo: "barton-outreach-core"
source_paths:
  - "hubs/people-intelligence/imo/middle/"
runtime: "python"
status: "extracted"

description: >
  Contact slot filling pipeline: CEO/CFO/HR slot assignment, email
  generation, verification waterfall. Feeds DECISION_SURFACE signals
  to BIT. 285k slots, 62.4% filled.

dependencies:
  databases:
    - schema: "vendor"
      tables: ["people"]
      access: "READ/WRITE"
    - schema: "people"
      tables: ["slot_ingress_control", "title_slot_mapping", "company_slot", "people_master"]
      access: "READ/WRITE"
    - schema: "outreach"
      tables: ["bit_scores"]
      access: "WRITE"
  apis:
    - "Hunter"
    - "Clay"
    - "Apollo"
  secrets:
    - "DOPPLER_TOKEN"
    - "NEON_CONNECTION_STRING"
    - "HUNTER_API_KEY"

imo:
  ingress:
    trigger: "Company present in outreach.company_target — people pipeline phases 5-8"
    schema: "vendor.people (Hunter contacts, scrapers) → people.company_slot + people.people_master"
  egress:
    outputs:
      - "people.company_slot (285k slots)"
      - "people.people_master (183k contacts)"
      - "BIT DECISION_SURFACE signals (SLOT_FILLED +10, EMAIL_VERIFIED +3)"
    consumers: ["BIT Scoring process", "LCS signal queue", "Talent Flow process"]

orbt:
  mode: "OPERATE"
  health: "GREEN"
  notes: "182,946 people records, 285,012 slots (62.4% filled), verification agent chain v1.3 active"

log_targets:
  - "log/007-people-intel/"

dashboard_ref: "PROC-PEOPLE-ENRICH"
