name: process-070-garage-queue
version: "1.1.0"
status: BUILD
owner_process: bp.070-four-brain
purpose: >
  Path-based intake queue for Process 070 Planner work. Agents deposit filled
  Planner Intake packets under garage/inbox. Planner claims packets marked
  READY_FOR_PLANNER and produces Plan Books for Foreman dispatch.

paths:
  inbox: "factory/imo-creator/070-four-brain/garage/inbox"
  outbox: "factory/imo-creator/070-four-brain/garage/outbox"
  template_md: "factory/imo-creator/070-four-brain/PLANNER-INTAKE-TEMPLATE.md"
  template_yaml: "factory/imo-creator/070-four-brain/planner-intake-template.yaml"
  plan_book_shelf: "docs/plans"
  final_product_pointer: "factory/imo-creator/070-four-brain/garage/outbox/BAR-{id}/FINAL-PRODUCT.yaml"

status_values:
  - DRAFT
  - READY_FOR_PLANNER
  - PLANNER_RUNNING
  - REVIEW_PLAN_BOOK
  - PLAN_BOOK_SIGNED
  - FOREMAN_RUNNING
  - REVIEW_FOREMAN_DISPATCH
  - FOREMAN_DISPATCHED
  - MECHANIC_RUNNING
  - REVIEW_MECHANIC_OUTPUT
  - MECHANIC_DONE
  - AUDITOR_RUNNING
  - REVIEW_AUDIT_VERDICT
  - CLOSED
  - BLOCKED
  - TROUBLESHOOT_TRAIN

pickup_rule:
  required_file: "planner-intake.yaml"
  required_status: "READY_FOR_PLANNER"
  claim_update: "garage_status: PLANNER_RUNNING"
  claim_fields:
    - planner_claimed_by
    - planner_claimed_at

handoff:
  model_routing:
    planner: "ForeBrain / Claude Opus"
    foreman: "Sonnet/default routing model; Opus escalation only"
    mechanic: "Sonnet"
    auditor: "Codex"
  planner_input:
    - "PLANNER-INTAKE.md"
    - "planner-intake.yaml"
    - "Atlas references named in the packet"
    - "Process 070 PROCESS-UT.md"
    - "Process 070 four-brain.yaml"
  planner_output:
    - "docs/plans/BAR-{id}/PLAN-BOOK.md"
    - "factory/imo-creator/070-four-brain/garage/outbox/BAR-{id}/FINAL-PRODUCT.yaml"
  foreman_output:
    - "Mechanic dispatch packets"
  evidence:
    - "LB&B role transition rows required before role transition; --defer-lbb is local dry-test only"
    - "Mission Control run/transition rows when available"
    - "Git commit or pushed SHA for repo changes"

review_gates:
  default_rule: "Pause at REVIEW_* unless --auto-continue is passed."
  approval_transitions:
    REVIEW_PLAN_BOOK: "PLAN_BOOK_SIGNED"
    REVIEW_FOREMAN_DISPATCH: "FOREMAN_DISPATCHED"
    REVIEW_MECHANIC_OUTPUT: "MECHANIC_DONE"
    REVIEW_AUDIT_VERDICT: "CLOSED"
  checklist_artifacts:
    planner_to_foreman: "APPROVAL-CHECKLIST-PLAN_BOOK_SIGNED.md"
    foreman_to_mechanic: "APPROVAL-CHECKLIST-FOREMAN_DISPATCHED.md"
    mechanic_to_auditor: "APPROVAL-CHECKLIST-MECHANIC_DONE.md"
  gate_rules:
    planner_to_foreman:
      - "Plan Book exists and is READY-FOR-FOREMAN before signing."
      - "Plan Book contains handoff, Mechanic dispatch requirements, Auditor packet requirements, P=1 definition, stop conditions, and sovereign decision table."
      - "Approval command signs the Plan Book artifact and garage YAML together."
    foreman_to_mechanic:
      - "Foreman dispatch exists and is not BLOCKED."
      - "Dispatch cites Atlas/Step 0, addresses Mechanic, includes write scope, forbidden paths, work orders, acceptance/evidence gates, and preserves Mechanic != Auditor."
      - "Dispatch does not make Foreman the builder."
    mechanic_to_auditor:
      - "Mechanic output exists with changed files, tests/validation, Plan Book reference, and Auditor handoff."
      - "PROC-060 PROCESS-UT.md and companion workflow YAML exist."
      - "Both artifacts contain FCE-00 through FCE-14 spine endpoints."
      - "Locked us.py/up.py files remain clean when the blueprint repo is present."

foreman_delegation_gate:
  doctrine: "atlas/constants/FOUR_BRAIN_AVIATION.md v1.3.0"
  default_model: "sonnet"
  escalation_model: "opus"
  requires:
    - "signed Plan Book before Foreman dispatch"
    - "dispatch packet only; no code edits"
    - "Atlas Step 0 citations in dispatch output"
    - "LB&B handoff row before Mechanic transition"
    - "Auditor review of Foreman dispatch against Plan Book"

final_product_contract:
  pointer_file: "factory/imo-creator/070-four-brain/garage/outbox/BAR-{id}/FINAL-PRODUCT.yaml"
  rule: >
    The outbox pointer is the pickup ticket. It does not replace the durable
    artifact; it tells the next agent or operator where the artifact lives,
    what status it reached, and what evidence exists.
  required_fields:
    - bar_id
    - final_status
    - primary_artifact
    - intake_path
    - run_dir
    - evidence
    - next_owner
    - updated_at

runtime_note: >
  This queue is the near-automation contract before BAR-FOUR-BRAIN-CLI exists.
  Do not claim a fully automated 070 run unless a real runner or endpoint writes
  the expected LB&B and Mission Control evidence.
