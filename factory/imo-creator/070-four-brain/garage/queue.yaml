name: process-070-garage-queue
version: "1.3.1"
last_modified: "2026-05-08"
status: BUILD
owner_process: bp.070-four-brain
mission_control_exempt: true
mission_control_exempt_reason: Mutable runtime queue state. Pipeline state surfaced via mission-control.system.pipeline slot. Per BAR-070-MC-WIRE Plan Book §7.
purpose: >
  Path-based intake queue for Process 070 Planner work. Agents deposit filled
  Planner Intake packets under garage/inbox. Planner claims packets marked
  READY_FOR_PLANNER and produces Plan Books for Foreman dispatch.

paths:
  inbox: "factory/imo-creator/070-four-brain/garage/inbox"
  outbox: "factory/imo-creator/070-four-brain/garage/outbox"
  template_md: "factory/imo-creator/070-four-brain/PLANNER-INTAKE-TEMPLATE.md"
  template_yaml: "factory/imo-creator/070-four-brain/planner-intake-template.yaml"
  plan_book_shelf: "docs/plans"
  final_product_pointer: "factory/imo-creator/070-four-brain/garage/outbox/BAR-{id}/FINAL-PRODUCT.yaml"

status_values:
  - DRAFT                # Initial pre-submit state; operator creates intake but has not submitted. Template enum begins at READY_FOR_PLANNER (operator-submitted state).
  - READY_FOR_PLANNER
  - PLANNER_RUNNING
  - REVIEW_PLAN_BOOK
  - PLAN_BOOK_SIGNED
  - FOREMAN_RUNNING
  - REVIEW_FOREMAN_DISPATCH
  - FOREMAN_DISPATCHED
  - MECHANIC_RUNNING
  - REVIEW_MECHANIC_OUTPUT
  - MECHANIC_DONE
  - AUDITOR_RUNNING
  - REVIEW_AUDIT_VERDICT
  - CLOSED
  - BLOCKED
  - TROUBLESHOOT_TRAIN

pickup_rule:
  required_file: "planner-intake.yaml"
  required_status: "READY_FOR_PLANNER"
  claim_update: "garage_status: PLANNER_RUNNING"
  claim_fields:
    - planner_claimed_by
    - planner_claimed_at

handoff:
  model_routing:
    planner: "ForeBrain / Claude Opus"
    foreman: "Sonnet/default routing model; Opus escalation only"
    mechanic: "Sonnet"
    auditor: "Codex"
  planner_input:
    - "PLANNER-INTAKE.md"
    - "planner-intake.yaml"
    - "Atlas references named in the packet"
    - "Process 070 PROCESS-UT.md"
    - "Process 070 four-brain.yaml"
  planner_output:
    - "docs/plans/BAR-{id}/PLAN-BOOK.md"
    - "factory/imo-creator/070-four-brain/garage/outbox/BAR-{id}/FINAL-PRODUCT.yaml"
  foreman_output:
    - "Mechanic dispatch packets"
  evidence:
    - "LB&B role transition rows required before role transition; --defer-lbb is local dry-test only"
    - "Mission Control run/transition rows when available"
    - "Git commit or pushed SHA for repo changes"

review_gates:
  # review_gates — G-19 auto-advance contract
  #
  # Per MISSION_CONTROL.md §10.4 + FOUR_BRAIN_AVIATION.md, sovereign influence
  # is restricted to template-drop boundary (input) and Auditor verdict boundary
  # (output). Mid-pipeline gates (PLAN_BOOK_SIGNED, FOREMAN_DISPATCHED,
  # MECHANIC_DONE) are artifact-existence checks ONLY. Content judgment is
  # enforced by the deterministic gate set (gate-runner.py) and W-7 LLM tail
  # arbitration at audit time, not by these mid-pipeline review_gates.
  #
  # `auto_continue: true` is the default per G-19. The legacy `approve` subcommand
  # remains for opt-in manual review during debugging.
  default_rule: "Auto-advance through REVIEW_* stages per G-19 (MISSION_CONTROL.md §10.4). Use --no-auto-continue or `approve` subcommand for opt-in manual review during debugging only."
  approval_transitions:
    REVIEW_PLAN_BOOK: "PLAN_BOOK_SIGNED"
    REVIEW_FOREMAN_DISPATCH: "FOREMAN_DISPATCHED"
    REVIEW_MECHANIC_OUTPUT: "MECHANIC_DONE"
    REVIEW_AUDIT_VERDICT: "CLOSED"
  checklist_artifacts:
    planner_to_foreman: "APPROVAL-CHECKLIST-PLAN_BOOK_SIGNED.md"
    foreman_to_mechanic: "APPROVAL-CHECKLIST-FOREMAN_DISPATCHED.md"
    mechanic_to_auditor: "APPROVAL-CHECKLIST-MECHANIC_DONE.md"
  gate_rules:
    planner_to_foreman:
      # Orchestrator gate: sign_plan_book_gate() in forebrain-garage.sh:1330-1374
      # Mechanical check (artifact exists only). Auto-advances if Plan Book file
      # exists at expected path. Blocked only if the file is absent.
      - "Plan Book artifact exists at the expected path (docs/plans/BAR-{id}/PLAN-BOOK.md)."
      - "If artifact exists → auto-advance PLANNER_RUNNING → PLAN_BOOK_SIGNED → FOREMAN_RUNNING per G-19."
      - >
        Plan Book content quality (Atlas citations, completeness of all required sections,
        BS Law conformance, Mission Control wiring section) is the Auditor's responsibility
        at the output boundary via W-7 + deterministic gate set G01-G12, W-1–W-6,
        Rung-1–Rung-8. Content judgment does NOT occur at this mid-pipeline gate.
    foreman_to_mechanic:
      # Orchestrator gate: approve_foreman_dispatch_gate() in forebrain-garage.sh:1376-1423
      # Mechanical check (artifact exists only). Auto-advances if Foreman dispatch file
      # exists at run_dir/FOREMAN-DISPATCH.md. Blocked only if the file is absent.
      - "Foreman dispatch artifact exists at the expected run-dir path (FOREMAN-DISPATCH.md)."
      - "If artifact exists → auto-advance FOREMAN_RUNNING → FOREMAN_DISPATCHED → MECHANIC_RUNNING per G-19."
      - >
        Foreman dispatch content quality (Atlas Step-0 citations, write scope declarations,
        work order structure, forbidden paths, Aviation Model role separation) is the
        Auditor's responsibility at the output boundary. Content judgment does NOT occur
        at this mid-pipeline gate.
    mechanic_to_auditor:
      # Orchestrator gate: approve_mechanic_output_gate() in forebrain-garage.sh:1425-1476
      # Mechanical check (artifact exists only). Auto-advances if MECHANIC-OUTPUT.md
      # exists at run_dir. Blocked only if the file is absent.
      - "MECHANIC-OUTPUT.md exists in the run dir with status=completed."
      - "If artifact exists → auto-advance MECHANIC_RUNNING → MECHANIC_DONE → AUDITOR_RUNNING per G-19."
      - >
        Mechanic output content quality (file change list, test/validation evidence,
        Plan Book reference, Auditor handoff completeness) is the Auditor's responsibility
        at the output boundary. Content judgment does NOT occur at this mid-pipeline gate.
      - "All work orders in FOREMAN-DISPATCH.md §3 are addressed in MECHANIC-OUTPUT.md 'Files changed' or marked PLAN_BOOK_INCOMPLETE."
      - "Mechanic edits stayed within the dispatch's allowed_write_scope and outside forbidden_paths."
      - "Per Mission Control wiring protocol: each artifact's WIRE/EXEMPT/NEW_SLOT_NEEDED disposition was executed per Plan Book §7."

foreman_delegation_gate:
  doctrine: "atlas/constants/FOUR_BRAIN_AVIATION.md v1.3.0"
  default_model: "sonnet"
  escalation_model: "opus"
  requires:
    - "signed Plan Book before Foreman dispatch"
    - "dispatch packet only; no code edits"
    - "Atlas Step 0 citations in dispatch output"
    - "LB&B handoff row before Mechanic transition"
    - "Auditor review of Foreman dispatch against Plan Book"

final_product_contract:
  pointer_file: "factory/imo-creator/070-four-brain/garage/outbox/BAR-{id}/FINAL-PRODUCT.yaml"
  rule: >
    The outbox pointer is the pickup ticket. It does not replace the durable
    artifact; it tells the next agent or operator where the artifact lives,
    what status it reached, and what evidence exists.
  required_fields:
    - bar_id
    - final_status
    - primary_artifact
    - intake_path
    - run_dir
    - evidence
    - next_owner
    - updated_at

runtime_note: >
  This queue is the near-automation contract before BAR-FOUR-BRAIN-CLI exists.
  Do not claim a fully automated 070 run unless a real runner or endpoint writes
  the expected LB&B and Mission Control evidence.
