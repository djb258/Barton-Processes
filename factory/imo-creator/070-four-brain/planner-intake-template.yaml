name: planner-intake-template
version: "2.0.0"
status: TEMPLATE
last_modified: "2026-05-06"
paired_md: PLANNER-INTAKE-TEMPLATE.md
purpose: >
  Thin operator-facing source packet. Operator answers four mandatory questions
  (IMO + Type) plus a conditional follow-up and six optional fields. The Planner
  translates the plain-language answers into structured doctrine (CTB, BS Law,
  read set, connector binding, P=1, audit packet) by consulting Atlas. Operator
  does not need to know doctrine vocabulary.

# =============================================================================
# OUTSIDE — identity in the Library / CTB / Atlas
# =============================================================================

outside:
  bs_law_arm: outside_dewey
  book_law_species: Workflow-Body
  heir:
    sovereign_ref: imo-creator
    hub_id: planner-intake-template
    ctb_placement: barton-enterprises/imo-creator/processes/four-brain/planner-intake-template
    imo_topology: input
    cc_layer: CC-02
    services:
      - Barton-Processes
      - imo-creator-v2 atlas
      - Process 070 Four-Brain
      - LBB
      - Mission Control
    secrets_provider: none
    acceptance_criteria: >
      An operator with no doctrine vocabulary can drop a BAR by answering
      four plain-language questions plus a conditional follow-up. The Planner
      can produce a Plan Book from the packet OR mark BLOCKED with a specific
      question back to the operator.
    species: Workflow-Body
  orbt:
    library_state: BUILD
    indexed_by: sonnet-mechanic

# =============================================================================
# INSIDE — runtime identity
# =============================================================================

inside:
  bs_law_arm: inside_fractal
  heir:
    process_id: bp.070-planner-intake-template
    parent_process: bp.070-four-brain
    output_type: planner_intake_packet
    aviation_model:
      planner: opus-4-7
      foreman: sonnet
      mechanic: sonnet
      auditor: codex
      rule: "mechanic != auditor"
    determinism_gate: ai_on_spine_forbidden
    determinism_gate_note: >
      LLM is tail arbitration only — never the spine of any gate evaluation.
      Planner translates operator plain-language answers into structured doctrine;
      that translation is LLM-assisted but every gate predicate is deterministic.
  orbt:
    runtime_state: BUILD
    promotion_gate: "used successfully by 3+ BARs end-to-end with auditor P=1"

# =============================================================================
# BS LAW CONFORMANCE
# =============================================================================

bs_law_conformance:
  law: "Book and Spine together, always."
  source: "imo-creator-v2/atlas/constants/BS_LAW.md"
  syntactic_separation:
    outside_construct: outside
    inside_construct: inside
    rule: "outside and inside are distinct top-level YAML constructs."
  book_arm:
    species: Workflow-Body
    durable_artifact: true
    paired_markdown: PLANNER-INTAKE-TEMPLATE.md
  spine_arm:
    heir_present: true
    orbt_present: true
    ctb_present: true
    imo_present: true

# =============================================================================
# TEMPLATE STRUCTURE — the four mandatory + conditional + six optional
# =============================================================================

template_structure:
  philosophy: |
    Operator owns: the destination (where from / what / where to) and the
    type of work (build / fix / maintenance). That's it.

    Planner owns: CTB lookup, source-of-truth split, read set, connector
    binding, P=1 definition, audit packet, mechanic dispatch hints. All
    derived from Atlas + the four answers above.

    99.9% of operator dispatches are sovereign-issued. Don't over-engineer
    the front door.

  mandatory:
    - id: Q1
      label: where_from
      prompt: "Where is the information / signal / trigger coming from?"
      format: free_text
      required: true

    - id: Q2
      label: what
      prompt: "What do you want done with it?"
      format: free_text
      required: true

    - id: Q3
      label: where_to
      prompt: "Where does the result go?"
      format: free_text
      required: true

    - id: Q4
      label: type
      prompt: "Pick one: Build / Fix / Maintenance."
      format: enum
      enum: [build, fix, maintenance]
      required: true
      asked_position: last_of_mandatory
      drives: Q4A_conditional

  conditional:
    Q4A:
      depends_on: Q4
      branches:
        build:
          label: maintenance_cadence
          prompt: "After this is built, what's the maintenance cadence?"
          format: enum
          enum: [a_check_weekly, b_check_monthly, c_check_quarterly, d_check_yearly, none]
        fix:
          label: squawk_symptom
          prompt: "What is broken? What did you observe?"
          format: free_text
        maintenance:
          label: check_level
          prompt: "Which scheduled check level?"
          format: enum
          enum: [a_check_weekly, b_check_monthly, c_check_quarterly, d_check_yearly, ad_event_driven]

  optional:
    - id: O1
      label: why
      prompt: "Why does this matter? Driver, deadline, business context."
    - id: O2
      label: who_for
      prompt: "Who consumes the output?"
    - id: O3
      label: deadline
      prompt: "Date / event / no rush."
    - id: O4
      label: constraints
      prompt: "Locked files, no-touch zones, sovereign-only decisions."
    - id: O5
      label: existing
      prompt: "Anything in flight, already documented, already failed."
    - id: O6
      label: reference
      prompt: "Files, BAR IDs, LBB rows, Linear issues, screenshots."

# =============================================================================
# EDGE-CASE ROUTING — for Planner classification, not operator
# =============================================================================

edge_case_routing:
  refactor: build
  research: build
  delete: fix
  audit_or_review: maintenance
  investigate: fix

# =============================================================================
# GARAGE STATUS — the trigger field
# =============================================================================

garage_status:
  current: DRAFT
  strike_count: 0
  enum:
    - DRAFT                     # Parked, not ready
    - READY_FOR_PLANNER         # In the bay with work order on windshield
    - PLANNER_RUNNING           # Planner has claimed it
    - PLAN_BOOK_SIGNED          # Plan Book produced and sovereign-signed; Foreman can dispatch
    - FOREMAN_RUNNING           # Foreman is producing the dispatch
    - FOREMAN_DISPATCHED        # Foreman dispatch written; Mechanic not yet started
    - MECHANIC_RUNNING          # Mechanic is executing work orders
    - MECHANIC_DONE             # Mechanic output written; Auditor not yet started
    - AUDITOR_RUNNING           # Auditor is inspecting
    - REVIEW_PLAN_BOOK          # Awaiting sovereign review of Plan Book
    - REVIEW_FOREMAN_DISPATCH   # Awaiting sovereign review of Foreman dispatch
    - REVIEW_MECHANIC_OUTPUT    # Awaiting sovereign review of Mechanic output
    - REVIEW_AUDIT_VERDICT      # Awaiting sovereign review of Audit verdict
    - BLOCKED                   # Planner asks question back to operator
    - TROUBLESHOOT_TRAIN        # Strike 3 — structural investigation; pipeline halted
    - CLOSED                    # BAR finished
  trigger_field: true
  rule: "Watcher polls this field. READY_FOR_PLANNER triggers Planner pickup."

# =============================================================================
# PLANNER RESPONSIBILITIES — what the Planner does after pickup
# =============================================================================

planner_responsibilities:
  step_0_atlas_pre_flight:
    - "Read atlas/constants/KEY.md (vocabulary)"
    - "Read atlas/constants/BS_LAW.md (Book + Spine)"
    - "Read atlas/manifests/STRUCTURE_MANIFEST.yaml (CTB)"
    - "Read atlas/constants/FOUR_BRAIN_AVIATION.md (role separation)"
    - "Read atlas/constants/MISSION_CONTROL.md §10 (artifact wiring authority)"

  discipline_order:
    - 0_atlas_pre_flight: non_negotiable
    - 1_simplicity_gate: "default NO on new builds; reuse beats reinvent"
    - 2_inventory: "Library Books, workers, scripts, FCEs, schemas"
    - 3_priority_ladder: "existing automation > new automation > new code > AI (last resort)"
    - 4_bs_law_lens: "every output Book passes the Y-junction"
    - 5_determinism_first: "AI never on the spine"

  derived_from_operator_answers:
    - ctb_position
    - source_of_truth_split
    - read_set
    - connector_run_binding
    - p1_definition
    - mission_control_wiring_disposition  # WIRE | EXEMPT | NEW_SLOT_NEEDED
    - mechanic_work_orders
    - auditor_packet

  blocking_rule: |
    If any mandatory operator answer is ambiguous, set garage_status: BLOCKED
    and write a single specific question back. Do not guess.

# =============================================================================
# PROCESS 070 START CONTRACT
# =============================================================================

process_070_start_contract:
  canonical_paths:
    intake_markdown: "Barton-Processes/factory/imo-creator/070-four-brain/garage/inbox/BAR-{id}/PLANNER-INTAKE.md"
    intake_yaml: "Barton-Processes/factory/imo-creator/070-four-brain/garage/inbox/BAR-{id}/planner-intake.yaml"
    plan_book: "Barton-Processes/docs/plans/BAR-{id}/PLAN-BOOK.md"
    final_product_pointer: "Barton-Processes/factory/imo-creator/070-four-brain/garage/outbox/BAR-{id}/FINAL-PRODUCT.yaml"
  commands:
    new: "factory/imo-creator/070-four-brain/garage/forebrain-garage.sh new BAR-{id}"
    run_once_execute: "factory/imo-creator/070-four-brain/garage/forebrain-garage.sh run-once --execute"
    watch_execute: "factory/imo-creator/070-four-brain/garage/forebrain-garage.sh watch --execute --interval 3"
    final: "factory/imo-creator/070-four-brain/garage/forebrain-garage.sh final BAR-{id}"

# =============================================================================
# NON-DRIFT INVARIANTS
# =============================================================================

non_drift_invariants:
  common:
    - "Operator owns destination + type. Planner owns route."
    - "Foreman dispatches; Mechanic builds; Auditor certifies."
    - "Mechanic cannot audit its own work."
    - "BS Law applies to every durable structured artifact."
    - "Mechanic does not change Mission Control skeleton without sovereign sign-off."
    - "Wiring disposition (WIRE / EXEMPT / NEW_SLOT_NEEDED) is declared by Planner in Plan Book, executed by Mechanic, verified by Auditor."

# =============================================================================
# PARITY ZONE — BS Law v1.5.0 paired-artifact synchronization contract
# =============================================================================

parity_zone:
  law: "BS Law v1.5.0 — paired-artifact parity"
  paired_md: PLANNER-INTAKE-TEMPLATE.md
  enforcement: "Codex G06 parsed_value_match — drift = BLOCK"
  synchronized_fields:
    - yaml_field: version
      md_field: "Version (header + Document Control)"
      sync_rule: Bump together
    - yaml_field: last_modified
      md_field: "Last Modified (header + Document Control)"
      sync_rule: Update together
    - yaml_field: status
      md_field: "Status (header + Document Control)"
      sync_rule: Match always
    - yaml_field: garage_status.enum
      md_field: "Garage Intake Status table rows"
      sync_rule: Every MD status row must appear in YAML enum
    - yaml_field: planner_responsibilities.discipline_order
      md_field: "What the Planner Does Next list"
      sync_rule: Steps must match in order
    - yaml_field: document_control.changelog
      md_field: "Changelog"
      sync_rule: Major entries mirrored
    - yaml_field: document_control.authority
      md_field: "Authority"
      sync_rule: Identical prose

# =============================================================================
# Document Control
# =============================================================================

document_control:
  version: "2.0.0"
  last_modified: "2026-05-06"
  status: TEMPLATE
  authority: "Sovereign-locked. Mechanic refactors instances; doctrine changes require sovereign sign-off."
  changelog:
    - "v1.0.0 (2026-05-05): Initial 19-section verbose template."
    - "v2.0.0 (2026-05-06): Collapsed to thin operator form (4 mandatory IMO+Type + conditional Q4A + 6 optional). Doctrine fill is Planner's job, not operator's. Added Mission Control wiring disposition to Planner deliverables per MISSION_CONTROL.md §10.4."
