description: |
  This recipe provides a universal, language-agnostic procedure for writing any
  computer program by decomposing the authoring process into exactly 10 steps,
  each corresponding to one K=C-certified primitive. When followed in order, the
  recipe guarantees that every construct in the resulting program traces to exactly
  one primitive with zero remainder. Successful application produces a complete,
  compilable/interpretable program whose every element is accounted for by the
  primitive taxonomy.

schedule:
  trigger: on-demand
  events:
    - on_program_authoring_request: "human or agent invokes the recipe to write a program"
  cron: null

data:
  read:
    - source: atlas/primitives/kc-certified-10.yaml
      what: The 10 K=C-certified primitives and their engine validation parameters
    - source: requirements/program-spec.md
      what: The specification of the program to be written
  write:
    - target: output/source-code/
      what: The produced program source file(s) fully traceable to primitives
  forbidden:
    - action: introduce_construct_outside_10_primitives
      why: Violates P=1 zero-remainder constraint; any external concept breaks coverage

nodes:
  - id: step-01
    label: "Define Primitive Types"
    primitive: Primitive Type
    description: "Identify and declare all basic data types the program requires — integers, floats, booleans, characters, strings. Every piece of data must have a type foundation."
    next: step-02

  - id: step-02
    label: "Identify Operands"
    primitive: Operand
    description: "Declare all variables, literals, and constants that will hold data. Each operand is typed per step-01. These are the nouns of the program."
    next: step-03

  - id: step-03
    label: "Select Operators"
    primitive: Operator
    description: "Choose the instructions that act upon operands — arithmetic, logical, comparison, assignment, function-call operators. These are the verbs of the program."
    next: step-04

  - id: step-04
    label: "Establish Scope Boundaries"
    primitive: Scope
    description: "Define the regions where each variable is valid and accessible — function bodies, blocks, modules. Scope prevents name collisions and controls lifetime."
    next: step-05

  - id: step-05
    label: "Design Execution Flow"
    primitive: Execution Flow
    description: "Arrange the sequence of instructions — sequential, conditional branching, looping, recursion. This determines the order in which operators act on operands."
    next: step-06

  - id: step-06
    label: "Specify State Transitions"
    primitive: State Transition
    description: "Identify every point where program state changes — variable assignment, mutation, I/O side effects. Each transition moves the program from one valid state to another."
    next: step-07

  - id: step-07
    label: "Define Interfaces"
    primitive: Interface
    description: "Establish contracts between components — function signatures, module APIs, I/O protocols. Interfaces define how data flows between scopes."
    next: step-08

  - id: step-08
    label: "Apply Encapsulation"
    primitive: Encapsulation
    description: "Bundle related data and operations into cohesive units — functions, modules, classes, closures. Encapsulation hides implementation behind interfaces."
    next: step-09

  - id: step-09
    label: "Compose Source Code"
    primitive: Source Code
    description: "Write the text file that encodes all prior decisions in the target language syntax. The source code is the physical artifact containing all primitives."
    next: step-10

  - id: step-10
    label: "Invoke Compiler/Interpreter"
    primitive: Compiler
    description: "Translate source code into executable form — compilation, interpretation, or transpilation. This step validates syntactic and semantic correctness."
    next: null

gates:
  total: 4
  pass_threshold: 4
  gate_list:
    - id: G01
      name: round_trip_zero_remainder
      predicate: "Every construct in 3 reference programs traces to exactly one primitive"
      tolerance: exact_match
      failure_impact: BLOCK
    - id: G02
      name: no_external_concepts
      predicate: "No construct requires a concept outside the 10 primitives to explain"
      tolerance: exact_match
      failure_impact: BLOCK
    - id: G03
      name: single_primitive_per_construct
      predicate: "Each construct maps to exactly one primitive, not multiple"
      tolerance: exact_match
      failure_impact: BLOCK
    - id: G04
      name: all_nodes_exercised
      predicate: "Every primitive cited in round_trip_validation has a corresponding node in the recipe"
      tolerance: exact_match
      failure_impact: BLOCK

round_trip_validation:
  hello_world_python:
    code_lines:
      - line: "print('Hello, World!')"
        primitive: Interface
        why: "print is the I/O interface contract — the function signature defining how the program communicates output to the external environment"
      - line: "'Hello, World!'"
        primitive: Operand
        why: "The string literal is data acted upon by the print operator"
      - line: "str type of the literal"
        primitive: Primitive Type
        why: "The string is a basic data type provided by the language"
      - line: "function call invocation"
        primitive: Operator
        why: "The call operation is the instruction that triggers execution of print"
      - line: "sequential single-statement execution"
        primitive: Execution Flow
        why: "The program executes one instruction in sequence"
      - line: "stdout buffer changes"
        primitive: State Transition
        why: "Writing to stdout mutates the I/O state of the program"
      - line: "module-level scope"
        primitive: Scope
        why: "The statement exists in the top-level module scope where it is valid"
      - line: "print function as bundled unit"
        primitive: Encapsulation
        why: "print encapsulates the logic of formatting and outputting within a single callable unit"
      - line: "the .py file itself"
        primitive: Source Code
        why: "The text file containing the program instruction"
      - line: "python interpreter processes the file"
        primitive: Compiler
        why: "The interpreter translates and executes the source code"
    remainder: 0
  fizzbuzz_rust:
    code_lines:
      - line: "fn main() {"
        primitive: Encapsulation
        why: "main bundles the program logic into a single callable unit with defined boundaries"
      - line: "for i in 1..=100 {"
        primitive: Execution Flow
        why: "The for loop defines iterative control flow over a range"
      - line: "1..=100"
        primitive: Operand
        why: "The range literal is data — the sequence of integers to iterate over"
      - line: "i"
        primitive: Primitive Type
        why: "i is an i32 integer, a basic data type"
      - line: "i % 3 == 0 && i % 5 == 0"
        primitive: Operator
        why: "Modulo, equality, and logical-and are operators acting on operands"
      - line: "if/else if/else"
        primitive: Execution Flow
        why: "Conditional branching determines which path executes"
      - line: "println!(\"Fizz\")"
        primitive: Interface
        why: "println! is the I/O interface contract for outputting to stdout"
      - line: "let binding and variable assignment"
        primitive: State Transition
        why: "Binding a value to a name transitions program state"
      - line: "block scope within for and if"
        primitive: Scope
        why: "Variables declared inside blocks are valid only within those regions"
      - line: "the .rs file itself"
        primitive: Source Code
        why: "The text file containing all Rust instructions"
      - line: "rustc compiles to binary"
        primitive: Compiler
        why: "The Rust compiler translates source to machine code"
      - line: "\"Fizz\", \"Buzz\", \"FizzBuzz\""
        primitive: Operand
        why: "String literals are data operands passed to the print interface"
      - line: "i32 type annotation"
        primitive: Primitive Type
        why: "Explicit integer type is a basic primitive type"
    remainder: 0
  bubble_sort_haskell:
    code_lines:
      - line: "bubbleSort :: [Int] -> [Int]"
        primitive: Interface
        why: "The type signature is the contract defining how the function communicates — input and output types"
      - line: "[Int]"
        primitive: Primitive Type
        why: "Int is a basic data type; the list is a type constructor over a primitive"
      - line: "bubbleSort xs = ..."
        primitive: Encapsulation
        why: "The function definition bundles the sorting algorithm into a single named unit"
      - line: "xs"
        primitive: Operand
        why: "The input list is the data operated upon by the sorting logic"
      - line: "if swapped then bubbleSort xs' else xs'"
        primitive: Execution Flow
        why: "Conditional recursion defines the control flow of repeated passes"
      - line: "swap (x:y:rest) = if x > y then ..."
        primitive: Operator
        why: "The comparison operator (>) and cons operator (:) are instructions acting on data"
      - line: "where clause introducing local bindings"
        primitive: Scope
        why: "where defines a region where local variables are valid and accessible"
      - line: "xs' = onePass xs"
        primitive: State Transition
        why: "Binding the result of a pass to a new name represents a state change in computation"
      - line: "the .hs file itself"
        primitive: Source Code
        why: "The text file containing the Haskell program"
      - line: "ghc compiles or runhaskell interprets"
        primitive: Compiler
        why: "GHC translates source code into executable form"
      - line: "swapped flag boolean"
        primitive: Primitive Type
        why: "Bool is a basic primitive type tracking whether a swap occurred"
      - line: "recursive call bubbleSort xs'"
        primitive: Execution Flow
        why: "Recursion is the flow mechanism that repeats execution until sorted"
    remainder: 0

coverage_check:
  primitives_used:
    - Source Code: 3
    - State Transition: 3
    - Compiler: 3
    - Execution Flow: 5
    - Operand: 4
    - Operator: 3
    - Primitive Type: 4
    - Scope: 3
    - Interface: 3
    - Encapsulation: 3
  any_unused: []

closing_claim: |-
  P=1 achieved. All three reference programs (Hello World in Python, FizzBuzz in
  Rust, Bubble Sort in Haskell) decompose completely into the 10 K=C-certified
  primitives with zero remainder and zero external concepts. Every construct in
  each program traces to exactly one primitive. All 10 primitives appear at least
  once across the validation set, confirming full coverage. The recipe is
  language-agnostic: the same 10-step sequence applies regardless of target
  language, paradigm, or compilation model.

