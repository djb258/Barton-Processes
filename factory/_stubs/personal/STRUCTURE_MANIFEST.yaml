# ─────────────────────────────────────────────────────────────────────────────
# IDENTITY
# ─────────────────────────────────────────────────────────────────────────────

identity:
  name: "Barton-Processes"
  role: "Process Engine — the muscle"
  parent: "imo-creator (CC-01 Sovereign)"
  relationship: "Children conform to parent. Never the reverse."

# ─────────────────────────────────────────────────────────────────────────────
# THE FOUR BUSINESS SILOS
# ─────────────────────────────────────────────────────────────────────────────
# Each business is a sovereign silo. Cross-silo communication is a violation.
# IMO-Creator is the parent. The other three are children.
# Same engine (Tier 0), different fuel (business domain).

business_silos:

  imo-creator:
    role: "PARENT — shared global infrastructure"
    path: "factory/imo-creator/"
    owns:
      - "Global reference tables (ZIP codes, geo lookups)"
      - "Meta-processes (adapter-build)"
      - "Shared tools used by all businesses"
    d1_database: "TBD — imo-d1-global (reference tables)"
    cross_silo_rule: "Children READ from parent. Never WRITE."
    processes:
      - number: "000"
        name: "Adapter Build"
        status: "ACTIVE"

  svg-agency:
    role: "CHILD — SVG insurance outreach"
    path: "factory/svg-agency/"
    owns:
      - "All SVG insurance processes (100-900)"
      - "Service agent coverage zones (3 agents)"
      - "DOL filing intelligence"
      - "People enrichment pipeline"
      - "LCS outreach pipeline"
    d1_databases:
      outreach: "svg-d1-outreach-ops (73a285b8)"
      spine: "svg-d1-spine (641a9a1e)"
    neon_vault: "Neon PostgreSQL via Hyperdrive"
    data_flow: "factory/svg-agency/DATA_FLOW.md"
    osam: "barton-outreach-core/doctrine/OSAM.md (v1.1.2)"
    processes:
      - number: "100"
        name: "LCS Pipeline"
        status: "ACTIVE"
      - number: "200"
        name: "People Worker"
        status: "REWRITE"
      - number: "300"
        name: "Blog Worker"
        status: "ACTIVE"
      - number: "400"
        name: "DOL Views"
        status: "ACTIVE"
      - number: "500"
        name: "Talent Flow"
        status: "ACTIVE"
      - number: "600"
        name: "BIT Scoring"
        status: "RETIRED"
      - number: "700"
        name: "Campaign Engine"
        status: "ACTIVE"
      - number: "800"
        name: "Client Mint"
        status: "ACTIVE"
      - number: "810"
        name: "Client Intake"
        status: "ACTIVE"
      - number: "820"
        name: "Vendor Export"
        status: "ACTIVE"
      - number: "830"
        name: "Client Portal"
