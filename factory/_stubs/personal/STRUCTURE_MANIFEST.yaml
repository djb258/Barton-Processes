# ─────────────────────────────────────────────────────────────────────────────
# CROSS-SILO RULES
# ─────────────────────────────────────────────────────────────────────────────

cross_silo_rules:
  - "Each business is a sovereign silo"
  - "Cross-silo communication is a violation"
  - "SVG does not know Real Estate exists"
  - "Children conform to parent (imo-creator). Never the reverse."
  - "IMO-Creator owns global infrastructure. Children READ, never WRITE."
  - "Same engine (Tier 0), different fuel (business domain)"

# ─────────────────────────────────────────────────────────────────────────────
# ALLOWED ROOT DIRECTORIES (from imo-creator STRUCTURE_MANIFEST.yaml)
# ─────────────────────────────────────────────────────────────────────────────

allowed_directories:
  law:
    purpose: "Governance — doctrine, registries, templates, audit template"
    connects_to_trunk_via: "Inherited from imo-creator"

  factory:
    purpose: "All executable processes — organized by business silo"
    connects_to_trunk_via: "Each silo conforms to law/"
    structure: "factory/{business-silo}/{NNN-process-name}/"

  docs:
    purpose: "Documentation — ADRs, architecture decisions"
    connects_to_trunk_via: "Records what law governs and factory produces"

  log:
    purpose: "Process execution receipts"

  scripts:
    purpose: "Extraction playbook and utilities"

  archive:
    purpose: "Retired processes and v1 extractions"

# ─────────────────────────────────────────────────────────────────────────────
# PER-PROCESS REQUIRED FILES
# ─────────────────────────────────────────────────────────────────────────────
# Every process directory MUST contain these files.
# Template: law/PROCESS_MANIFEST_TEMPLATE.md

process_structure:
  required_files:
    - "heir.yaml"        # Process identity (HEIR — 8 fields)
    - "CLAUDE.md"        # Agent operating instructions with Bedrock doctrine
    - "MANIFEST.md"      # Process manifest (11-block format)
  recommended_files:
    - "OSAM.md"          # Semantic access map (subset of hub OSAM)
    - "ERD.md"           # Entity relationship diagram
    - "PRD.md"           # Product requirements document
    - "LEARNINGS.md"     # Agent logbook (from factory/LEARNINGS_TEMPLATE.md)
    - "src/"             # Executable code
    - "wrangler.toml"    # CF Worker config (if applicable)

# ─────────────────────────────────────────────────────────────────────────────
# GATE ENFORCEMENT (inherited from imo-creator)
# ─────────────────────────────────────────────────────────────────────────────

enforcement:
  model: "gate-based"
  gates:
    - name: "tier0_validation"
      validator: "IMO + CTB + Circle (simultaneously)"
      defined_by: "imo-creator/law/doctrine/FOUNDATIONAL_BEDROCK.md"
    - name: "ctb_position"
      validator: "Process must declare its business silo and process number"
      defined_by: "This file (STRUCTURE_MANIFEST.yaml)"
    - name: "cqrs_write_path"
      validator: "Changes enter from leaves, promote through review"
      defined_by: "imo-creator/law/doctrine/FOUNDATIONAL_BEDROCK.md §4"
  audit_template: "law/PROCESS_AUDIT_TEMPLATE.md"
