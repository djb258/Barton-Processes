# ═══════════════════════════════════════════════════════════════
# Intelligence Engine — CF Queues-Based Scraping Infrastructure
# ═══════════════════════════════════════════════════════════════
# PRODUCER (cron): reads D1 → creates jobs → sends to Queue
# CONSUMER (queue): pulls jobs → fetches Startpage → writes D1
# Shares D1 with people-worker-200 (same edge workspace).
# ═══════════════════════════════════════════════════════════════

name = "intelligence-engine"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Daily cron — producer runs once a day at 6am UTC
[triggers]
crons = ["0 6 * * *"]

# D1 — shared working database (edge) with people-worker-200
[[d1_databases]]
binding = "D1"
database_name = "people-worker-200"
database_id = "4fa3b760-d8c9-4f94-8291-e0f85fc2a3a4"

# Queue — intelligence jobs
[[queues.producers]]
queue = "intelligence-queue"
binding = "INTELLIGENCE_QUEUE"

[[queues.consumers]]
queue = "intelligence-queue"
max_batch_size = 10
max_retries = 3
dead_letter_queue = "intelligence-dlq"
max_batch_timeout = 300

[vars]
# Proxy config (DataImpulse residential proxy)
PROXY_HOST = "gw.dataimpulse.com"
PROXY_PORT = "823"
# Jobs per cron invocation
BATCH_SIZE = "50"
# Delay between fetches within a queue batch (ms)
MIN_DELAY_MS = "3000"
MAX_DELAY_MS = "8000"

# Secrets (set via `wrangler secret put <NAME>`):
#   NEON_URL     — Neon Postgres connection string
#   PROXY_USER   — DataImpulse proxy username
#   PROXY_PASS   — DataImpulse proxy password
