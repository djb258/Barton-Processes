# Process HEIR — 006-dol-refresh
process_id: "PROC-DOL-ENRICH"
process_number: "006"
name: "DOL Enrichment"
short_name: "DOL"
source_repo: "barton-outreach-core"
source_paths:
  - "hubs/dol-filings/imo/middle/"
runtime: "python"
status: "extracted"

description: >
  EIN resolution and Form 5500 + Schedule A filing data enrichment.
  Matches companies to DOL filings, extracts funding type, carrier,
  broker, renewal month. Feeds STRUCTURAL_PRESSURE signals to BIT.

dependencies:
  databases:
    - schema: "dol"
      tables: ["form_5500", "ein_urls", "schedule_a", "renewal_calendar"]
      access: "READ"
    - schema: "outreach"
      tables: ["dol", "bit_scores"]
      access: "WRITE"
  apis: []
  secrets:
    - "DOPPLER_TOKEN"
    - "NEON_CONNECTION_STRING"

imo:
  ingress:
    trigger: "Company present in outreach.company_target with outreach_id"
    schema: "dol.form_5500 (11M+ rows, 2023-2025), dol.ein_urls, dol.schedule_a, dol.renewal_calendar"
  egress:
    outputs:
      - "outreach.dol enrichment columns (ein, filing_present, funding_type, carrier, broker, renewal_month)"
      - "BIT STRUCTURAL_PRESSURE signals"
    consumers: ["BIT Scoring process", "LCS signal queue"]

orbt:
  mode: "OPERATE"
  health: "GREEN"
  notes: "70,150 DOL records enriched (100% EIN, 92% filing_present, 100% funding_type, 100% renewal_month)"

log_targets:
  - "log/006-dol-refresh/"

dashboard_ref: "PROC-DOL-ENRICH"
