    condition: "No active Chrome / NotebookLM browser session."
    action: "HALT. Operator must authenticate in Chrome and re-dispatch."
  - id: "STOP-1720-02"
    condition: "Source upload or paste fails, or source count does not match source_packet."
    action: "HALT. Do not trigger generation with partial sources."
  - id: "STOP-1720-03"
    condition: "NotebookLM generation times out or never signals completion."
    action: "HALT. Mark run FAILED and do not write handoff metadata."
  - id: "STOP-1720-04"
    condition: "Downloaded artifact is missing or zero bytes."
    action: "HALT. Do not call PROC-1800."
  - id: "STOP-1720-05"
    condition: "Artifact has no source_packet_id lineage."
    action: "HALT. Repair lineage before any downstream handoff."
  - id: "STOP-1720-06"
    condition: "Any raw Google credential is written to process files."
    action: "HALT. Remove credential, rotate if exposed, log incident."

rollback:
  safe_action: "Delete only failed run artifacts and handoff files for the current source_packet_id; do not modify notebook history unless Dave approves."
