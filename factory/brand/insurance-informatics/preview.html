<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insurance Informatics — Brand Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #f8f8f8; }
  .section { padding: 48px; }
  .section-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #94A3B8; margin-bottom: 24px; }
  .light { background: #ffffff; }
  .dark  { background: #0F2044; }
  .dark .section-label { color: #4a6a9a; }
  .row { display: flex; align-items: center; gap: 64px; flex-wrap: wrap; }
  .divider { height: 1px; background: #E2E8F0; }
  .dark .divider { background: #1a3060; }
  img { display: block; }
</style>
</head>
<body>

<!-- Light background -->
<div class="section light">
  <div class="section-label">Horizontal Lockup — Light</div>
  <div class="row">
    <img src="logos/insurance-informatics-horizontal.svg" width="400" height="80">
  </div>
</div>

<div class="divider"></div>

<!-- Dark background -->
<div class="section dark">
  <div class="section-label">Horizontal Lockup — Dark</div>
  <div class="row">
    <img src="logos/insurance-informatics-horizontal.svg" width="400" height="80">
  </div>
</div>

<div class="divider"></div>

<!-- Mark + Stacked side by side -->
<div class="section light">
  <div class="section-label">Mark Only &amp; Stacked Lockup</div>
  <div class="row">
    <img src="logos/insurance-informatics-mark-only.svg" width="80" height="80">
    <img src="logos/insurance-informatics-stacked.svg" width="200" height="150">
  </div>
</div>

<div class="divider"></div>

<!-- LinkedIn Banner -->
<div class="section light" style="padding: 48px 48px 48px 48px;">
  <div class="section-label">LinkedIn Banner (scaled)</div>
  <img src="linkedin/linkedin-banner.svg" style="width:100%;max-width:792px;height:auto;display:block;">
</div>

</body>
</html>
