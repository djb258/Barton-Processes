# ─────────────────────────────────────────────────────────────────────────────
# CROSS-SILO RULES
# ─────────────────────────────────────────────────────────────────────────────

cross_silo_rules:
  - "Each business is a sovereign silo"
  - "Cross-silo communication is a violation — branches talk through trunk only"
  - "SVG Outreach does not know Client exists (and vice versa)"
  - "Children conform to parent (imo-creator-v2). Never the reverse."
  - "Same engine (Tier 0), different fuel (business domain)"
  - "Garage (imo-creator-v2) = brain. This repo = muscle. Brain governs."

# ─────────────────────────────────────────────────────────────────────────────
# GATE ENFORCEMENT
# ─────────────────────────────────────────────────────────────────────────────

enforcement:
  validator_script: "scripts/validate-ctb.sh"
  model: "gate-based"
  gates:
    - name: "tier0_validation"
      validator: "IMO + CTB + Circle (simultaneously)"
      defined_by: "imo-creator-v2/law/doctrine/FOUNDATIONAL_BEDROCK.md"
    - name: "ctb_position"
      validator: "Every file/process declares its silo and number"
      defined_by: "This file (STRUCTURE_MANIFEST.yaml)"
    - name: "cqrs_write_path"
      validator: "Changes enter from leaves, promote upward through gates"
      defined_by: "imo-creator-v2/law/doctrine/FOUNDATIONAL_BEDROCK.md §4"
  audit_template: "law/PROCESS_AUDIT_TEMPLATE.md"
  registry: "law/process-registry.yaml v2.0.0"
