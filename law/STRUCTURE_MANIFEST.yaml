# ═══════════════════════════════════════════════════════════════════════════════
# STRUCTURE MANIFEST — Barton-Processes
# ═══════════════════════════════════════════════════════════════════════════════
# Status: GATED (conforms to imo-creator-v2 STRUCTURE_MANIFEST.yaml — LOCKED)
# Authority: imo-creator-v2/law/STRUCTURE_MANIFEST.yaml defines the pattern.
#            This file applies it to Barton-Processes and codifies R1-R8.
# Created: 2026-03-26
# Last Modified: 2026-04-29 (Stage 2.5 CTB Cleanup — R1-R8 codified)
# ═══════════════════════════════════════════════════════════════════════════════

version: "3.0.0"
effective_date: "2026-04-29"

# ─────────────────────────────────────────────────────────────────────────────
# IDENTITY
# ─────────────────────────────────────────────────────────────────────────────

identity:
  name: "Barton-Processes"
  role: "Process Engine — the muscle"
  parent: "imo-creator-v2 (CC-01 Sovereign)"
  relationship: "Children conform to parent. Never the reverse."
  ctb_position: "branch — under Barton Enterprises trunk"

# ─────────────────────────────────────────────────────────────────────────────
# CTB RULES (R1-R8) — Machine-Readable Enforcement
# Validator: scripts/validate-ctb.sh
# ─────────────────────────────────────────────────────────────────────────────

ctb_rules:

  R1:
    name: "trunk_root_allowlist"
    description: "Only allowlisted files and directories at Barton-Processes/ root"
    allowed_files:
      - "CLAUDE.md"
      - "README.md"
      - "INDEX.md"
      - "EXECUTION_ORDER.md"
      - "D1_DATA_DICTIONARY.md"
      - ".gitignore"
    allowed_dirs:
      - "law"
      - "docs"
      - "scripts"
      - "log"
      - "archive"
      - "factory"
    enforcement: "scripts/validate-ctb.sh R1"
    violation_action: "archive or remove"

  R2:
    name: "law_allowlist"
    description: "Only allowlisted governance files in law/"
    allowed_files:
      - "heir.yaml"
      - "orbt.yaml"
      - "process-registry.yaml"
      - "STRUCTURE_MANIFEST.yaml"
      - "ingress-manifest.yaml"
      - "logbook_schema.yaml"
      - "PROCESS_TEMPLATE.md"
      - "PROCESS_AUDIT_TEMPLATE.md"
    note: "law/doctrine/ must be empty (remove .gitkeep when present)"
    enforcement: "scripts/validate-ctb.sh R2"
    violation_action: "archive"

  R3:
    name: "factory_silo_no_loose_files"
    description: "factory/<silo>/ contains only subdirectories, no loose files"
    exemptions:
      - "_stubs/ (reserved silos awaiting numbered processes)"
      - "content/ (non-numbered content production folder)"
    enforcement: "scripts/validate-ctb.sh R3"
    violation_action: "move to archive/silo-level-fragments-YYYY-MM-DD/ or into relevant process _archived-fragments/"

  R4:
    name: "process_ut_shape"
    description: "Each factory/<silo>/<NNN-name>/ has the locked UT shape"
    required_entries:
      - "PROCESS-UT.md"      # Consolidated UT (14 sections, 13-item pre-flight, 16 anchors)
      - "DOCTRINE.md"        # Locked rules for this process
      - "heir.yaml"          # HEIR identity (8 fields)
      - "orbt.yaml"          # ORBT state (OPERATE/REPAIR/BUILD/TROUBLESHOOT_TRAIN)
      - "_archived-fragments/"  # Intra-process history (read-only)
    additional_for_deployable:
      - "wrangler.toml"      # CF Worker config
      - "package.json"
      - "tsconfig.json"
      - "src/"
      - "migrations/"        # if D1
    max_entries_deployable: 10
    enforcement: "scripts/validate-ctb.sh R4"
    violation_action: "add missing file or move extra to _archived-fragments/"

  R5:
    name: "no_mid_tier_orphans"
    description: "No orphaned process folders at non-numbered paths under factory/"
    archive_pattern: "archive/orphans-YYYY-MM-DD/"
    enforcement: "manual scan"
    violation_action: "move to archive/orphans-YYYY-MM-DD/"

  R6:
    name: "content_silo_for_non_numbered"
    description: "Non-numbered content folders (video, brand) go in factory/content/ only"
    allowed_content_path: "factory/content/"
    enforcement: "manual scan"
    violation_action: "move to factory/content/"

  R7:
    name: "empty_silos_in_stubs"
    description: "Empty business silos awaiting processes live in factory/_stubs/"
    current_stubs:
      - "factory/_stubs/personal/"
      - "factory/_stubs/real-estate/"
      - "factory/_stubs/production-line/"
    enforcement: "manual scan"
    violation_action: "move to factory/_stubs/"

  R8:
    name: "no_garage_internal_in_bp"
    description: "Garage-internal infrastructure (LBB, UP, adapter-build) lives in imo-creator-v2, not here"
    enforcement: "manual scan"
    violation_action: "move to archive/relocated-to-v2-YYYY-MM-DD/"

