# ═══════════════════════════════════════════════════════════════
# HEIR — Barton-Processes Identity Record
# ═══════════════════════════════════════════════════════════════
# Authority: imo-creator (Sovereign)
# Role: Process engine — ALL executable code lives here
# Taxonomy: Blueprint repos = brain (static). This repo = muscle (runtime).
# ═══════════════════════════════════════════════════════════════

doctrine_version: "3.5.0"
sovereign_ref: "imo-creator"
hub_id: "barton-processes"
hub_name: "Barton Processes"
ctb_placement: "factory"
imo_topology: "middle"
repo_type: "process-engine"

services:
  - "neon-db-agent"
  - "cl-pipeline"
  - "lcs-runtime"
  - "lcs-delivery"
  - "lcs-gates"
  - "dol-refresh"
  - "people-intel"
  - "blog-monitor"
  - "talent-flow"
  - "outreach-execution"
  - "field-monitor"
  - "client-ai-services"
  - "client-ui-api"
  - "sales-meeting-service"

secrets_provider: "doppler"

acceptance_criteria:
  - "Every process has a numbered directory under factory/"
  - "Every process has heir.yaml with declared dependencies"
  - "process-registry.yaml matches actual factory/ contents"
  - "ZERO executables remain in any blueprint repo after extraction"
  - "All cross-silo dependencies listed in ingress-manifest.yaml"

status: "phase-0"
